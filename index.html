/* ========== JSONインポート ========== */
// ファイル選択ダイアログを開いてテキストを読む共通ヘルパー
function pickJsonFile(onLoad){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{try{const data=JSON.parse(reader.result);onLoad(data,f.name);}
      catch(e){alert("JSONの読み込みに失敗しました。ファイルが壊れていないか確認してください。");}};
    reader.onerror=()=>alert("ファイルの読み込みに失敗しました。");
    reader.readAsText(f);};
  inp.click();
}
// レコードを正規化（必要なキーが揃っているか最低限チェック）
function validClassRecord(r){return r&&typeof r==="object"&&r.grade&&r.world&&r.day&&r.period&&r.subject!=null;}

function importClassJson(){
  if(!isLate()){alert("後期に切り替えてから読み込んでください");return;}
  pickJsonFile((data,fname)=>{
    if(!Array.isArray(data)){alert("このファイルはクラス時間割のデータではないようです。\n（後期時間割データ.json を選んでください）");return;}
    const recs=data.filter(validClassRecord);
    if(!recs.length){alert("読み込める授業データが見つかりませんでした。");return;}
    const hasExisting=lateRecords.length>0;
    let mode="replace";
    if(hasExisting){
      const ans=prompt(`「${fname}」から ${recs.length} コマを読み込みます。\n現在 ${lateRecords.length} コマが登録されています。\n\n方法を数字で選んでください：\n  1 = 置き換え（現在のデータを消して読み込む）\n  2 = 統合（同じ枠は上書き、空き枠は追加）\n\nキャンセルで中止`,"2");
      if(ans===null)return;
      if(ans.trim()==="1")mode="replace";
      else if(ans.trim()==="2")mode="merge";
      else{alert("1 か 2 を入力してください。中止しました。");return;}
    }
    if(mode==="replace"){
      lateRecords=recs.map(normClassRec);
    }else{
      // マージ：grade|world|day|period をキーに「枠ごと」上書き（選択科目=同枠複数も保持）
      const map={};
      lateRecords.forEach(r=>{const k=recKeyOf(r);(map[k]=map[k]||[]).push(r);});
      // 読み込んだデータは、同じ枠キーが来たら「その枠を丸ごと差し替え」
      const incoming={};
      recs.forEach(r=>{const nr=normClassRec(r);const k=recKeyOf(nr);(incoming[k]=incoming[k]||[]).push(nr);});
      Object.keys(incoming).forEach(k=>{map[k]=incoming[k];}); // 枠単位で上書き
      lateRecords=[];Object.values(map).forEach(arr=>arr.forEach(r=>lateRecords.push(r)));
    }
    saveLate();
    // 表示をリセットして反映
    cstate.grade=null;cstate.world=null;
    rebuildWorldChips();refreshChips("#classPanel",cstate);renderClass();
    alert(`読み込み完了：現在 ${lateRecords.length} コマになりました。`);
  });
}
function normClassRec(r){return {grade:+r.grade,world:String(r.world),day:String(r.day),period:+r.period,
  time:r.time||PTIME_FULL[+r.period]||"",subject:String(r.subject||""),teacher:String(r.teacher||""),
  room:String(r.room||""),note:String(r.note||"")};}
function recKeyOf(r){return [r.grade,r.world,r.day,r.period].join("|");}

function importPersonJson(){
  if(!isLate()){alert("後期に切り替えてから読み込んでください");return;}
  pickJsonFile((data,fname)=>{
    // 形式: {students:[...], records:[...]}
    if(!data||!Array.isArray(data.students)||!Array.isArray(data.records)){
      alert("このファイルは学生別のデータではないようです。\n（後期学生別データ.json を選んでください）");return;}
    const students=data.students.filter(s=>s&&s.name&&s.grade);
    const recs=data.records.filter(r=>r&&r.person&&r.day&&r.period&&r.subject!=null);
    if(!students.length){alert("読み込める学生データが見つかりませんでした。");return;}
    const hasExisting=latePersons.length>0;
    let mode="replace";
    if(hasExisting){
      const ans=prompt(`「${fname}」から 学生${students.length}名・コマ${recs.length}件 を読み込みます。\n現在 学生${latePersons.length}名が登録されています。\n\n方法を数字で選んでください：\n  1 = 置き換え（現在の学生別データを消して読み込む）\n  2 = 統合（同じ氏名は上書き、新しい学生は追加）\n\nキャンセルで中止`,"2");
      if(ans===null)return;
      if(ans.trim()==="1")mode="replace";
      else if(ans.trim()==="2")mode="merge";
      else{alert("1 か 2 を入力してください。中止しました。");return;}
    }
    if(mode==="replace"){
      latePersons=students.map(s=>({name:String(s.name),grade:+s.grade,world:s.world||null}));
      lateP=recs.map(normPersonRec);
    }else{
      // 学生：氏名キーで上書き
      const smap={};latePersons.forEach(s=>{smap[s.name]=s;});
      students.forEach(s=>{smap[String(s.name)]={name:String(s.name),grade:+s.grade,world:s.world||null};});
      latePersons=Object.values(smap);
      // レコード：person|day|period キーで上書き。読み込んだ学生のレコードは一旦全消し→入れ直し
      const importedNames=new Set(students.map(s=>String(s.name)));
      lateP=lateP.filter(r=>!importedNames.has(r.person)).concat(recs.map(normPersonRec));
    }
    saveLateP();
    pstate.person=null;rebuildPersonPick();renderPerson();
    alert(`読み込み完了：学生 ${latePersons.length} 名・コマ ${lateP.length} 件になりました。`);
  });
}
function normPersonRec(r){return {person:String(r.person),grade:+r.grade||null,day:String(r.day),period:+r.period,
  time:r.time||PTIME_FULL[+r.period]||"",subject:String(r.subject||""),teacher:String(r.teacher||""),
  room:String(r.room||""),note:String(r.note||"")};}

/* ========== 学期切替 ========== */
function setTerm(t){term=t;
  document.getElementById("termEarly").classList.toggle("on",t==="early");
  document.getElementById("termLate").classList.toggle("on",t==="late");
  document.getElementById("appHeader").classList.toggle("edit-mode",t==="late");
  document.body.classList.toggle("term-late",t==="late");
  setSaved(t==="late"?(lateRecords.length?`後期データ ${lateRecords.length}コマ`:"後期：未入力"):(earlyEditCount()?`前期 編集 ${earlyEditCount()}件`:""));
  // 学期で学生別データの母集合が変わるため、選択中の学生はリセット
  pstate.person=null;
  earlyEditMode=false; // 学期を切り替えたら前期編集モードはオフに戻す
  rebuildWorldChips();rebuildPersonPick();
  rstate.room=null;
  rebuildRoomPick();
  renderClass();renderPerson();renderFree();renderSlot();renderRoom();}
document.getElementById("termEarly").onclick=()=>setTerm("early");
document.getElementById("termLate").onclick=()=>setTerm("late");

/* ========== タブ切替 ========== */
function switchTab(t){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));
  ["class","person","free","slot","room"].forEach(v=>document.getElementById(v+"View").style.display=(v===t)?"":"none");
  if(t==="class")renderClass();else if(t==="person")renderPerson();else if(t==="free")renderFree();
  else if(t==="slot")renderSlot();else if(t==="room"){rebuildRoomPick();renderRoom();}}
document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>switchTab(tab.dataset.tab));

/* ========== サーバー同期（Vercel + Upstash Redis） ==========
   /api/data に GET（全員可）/ PUT（編集パスワード必須）でデータを読み書きする。
   サーバーに接続できない場合（file://で開いた等）は従来どおりlocalStorageのみで動く。 */
const API_URL="/api/data";
let serverMode=false;        // サーバーと同期中か
let serverUpdatedAt=null;    // 最後に読み込んだサーバーデータの更新時刻（競合検出用）
let pushTimer=null;

function renderAll(){
  rebuildWorldChips();rebuildPersonPick();rebuildRoomPick();
  renderClass();renderPerson();renderFree();renderSlot();renderRoom();
}
async function serverLoad(silent){
  if(location.protocol==="file:"){serverMode=false;return;} // ファイル直接開きは従来どおりローカルのみ
  try{
    let url=API_URL;const opts={cache:"no-store"};
    if(!VIEWER_MODE){
      // 編集画面：学生データを含む全データの取得にパスワードが必要
      let tok=null;try{tok=sessionStorage.getItem("thl_edit_token");}catch(e){}
      if(!tok){
        tok=prompt("編集画面を開きます。編集パスワードを入力してください：");
        if(tok){try{sessionStorage.setItem("thl_edit_token",tok);}catch(e){}}
      }
      if(!tok){serverMode=false;setSaved("⚠ サーバー同期オフ（パスワード未入力・この端末内のみ）");return;}
      opts.headers={"x-edit-token":tok};
    }else if(VIEWER_STUDENT_KEY){
      url+="?s="+encodeURIComponent(VIEWER_STUDENT_KEY);
    }
    const r=await fetch(url,opts);
    if(r.status===401){
      try{sessionStorage.removeItem("thl_edit_token");}catch(e){}
      serverMode=false;
      alert("編集パスワードが違います。ページを再読み込みして、正しいパスワードを入力してください。");
      setSaved("⚠ サーバー同期オフ（パスワード不一致）");return;
    }
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    serverMode=true;
    const btn=document.getElementById("syncReloadBtn");if(btn){btn.style.display="";btn.onclick=()=>serverLoad(false);}
    if(j&&j.exists){
      lateRecords=j.lateRecords||[];
      earlyEdits=j.earlyEdits||{};
      latePersons=j.latePersons||[];lateP=j.lateP||[];
      serverUpdatedAt=j.updatedAt||null;
      // 編集画面：キー未発行の学生がいれば発行してサーバーに反映
      if(!VIEWER_MODE){const added=ensureStudentKeys();if(added)saveLateP();}
      // ローカルにもキャッシュ（オフライン時の保険。閲覧版はキャッシュしない）
      if(!VIEWER_MODE){try{
        localStorage.setItem(STORE_KEY,JSON.stringify(lateRecords));
        localStorage.setItem(STORE_EEDIT,JSON.stringify(earlyEdits));
        localStorage.setItem(STORE_PKEY,JSON.stringify(latePersons));
        localStorage.setItem(STORE_PREC,JSON.stringify(lateP));
      }catch(e){}}
      viewerApplyStudent(j);
      renderAll();
      setSaved("サーバーから読込 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}));
    }else{
      viewerApplyStudent(null);
      setSaved("サーバー接続OK（データ未登録）");
    }
  }catch(e){
    serverMode=false;
    if(!silent)alert("サーバーに接続できませんでした。この端末内のデータで表示します。");
  }
}
/* 閲覧版：学生キーの結果に応じて学生別タブを出し分ける */
function viewerApplyStudent(j){
  if(!VIEWER_MODE)return;
  const pt=document.querySelector('.tab[data-tab="person"]');
  if(!VIEWER_STUDENT_KEY){if(pt)pt.style.display="none";return;}
  const ok=j&&j.student&&(latePersons||[]).length>0;
  if(!ok){
    if(pt)pt.style.display="none";
    if(j&&j.exists)alert("この学生用URLは無効です。担当者に新しいURLを確認してください。");
    return;
  }
  if(pt)pt.style.display="";
  // 学生の時間割は後期データなので、後期表示に自動で切り替える
  term="late";
  const te=document.getElementById("termEarly"),tl=document.getElementById("termLate");
  if(te)te.classList.remove("on");if(tl)tl.classList.add("on");
  pstate.person=latePersons[0].name; // 本人を自動選択
  switchTab("person"); // 開いた直後から本人の時間割を表示
  switchTab("person"); // 開いた直後から本人の時間割（学生別タブ）を表示する
}
function schedulePush(){
  if(!serverMode)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush,800); // 連続編集をまとめて送る
}
async function doPush(){
  if(!serverMode)return;
  let tok=null;
  try{tok=sessionStorage.getItem("thl_edit_token");}catch(e){}
  if(!tok){
    tok=prompt("編集内容をサーバーに保存します。\n編集パスワードを入力してください：");
    if(!tok){setSaved("⚠ サーバー未保存（パスワード未入力）");return;}
    try{sessionStorage.setItem("thl_edit_token",tok);}catch(e){}
  }
  try{
    const body={lateRecords,earlyEdits,latePersons,lateP,baseUpdatedAt:serverUpdatedAt};
    const r=await fetch(API_URL,{method:"PUT",
      headers:{"Content-Type":"application/json","x-edit-token":tok},
      body:JSON.stringify(body)});
    if(r.status===401){
      try{sessionStorage.removeItem("thl_edit_token");}catch(e){}
      alert("編集パスワードが違います。サーバーには保存されていません。");
      setSaved("⚠ サーバー未保存（パスワード不一致）");return;
    }
    if(r.status===409){
      alert("他の人が先にデータを更新しました。\n最新のデータを読み込み直します。\n（直前のあなたの変更はサーバーに保存されていません）");
      await serverLoad(true);return;
    }
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    serverUpdatedAt=j.updatedAt;
    setSaved("サーバーに保存 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    setSaved("⚠ サーバー保存に失敗（通信エラー）");
  }
}

/* ========== 閲覧モード / 編集モードのUI切替 ========== */
(function(){
  if(VIEWER_MODE){
    const tag=document.getElementById("viewerTag");if(tag)tag.style.display="";
    document.title="THL 時間割（閲覧版）";

    const pt=document.querySelector('.tab[data-tab="person"]');if(pt)pt.style.display="none";
  }
})();

rebuildRoomPick();
renderClass();renderPerson();renderFree();renderSlot();renderRoom();
serverLoad(true); // サーバーがあれば共有データを読み込む（無ければローカルのまま）
