<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THL 時間割ツール — 2026年度</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1a2332;--ink-soft:#5a6478;--line:#dde3ec;--line-soft:#eef1f6;
    --bg:#f7f8fb;--card:#ffffff;--accent:#0b6e8f;--accent-soft:#e3f1f6;
    --g1:#c0392b;--g2:#2c7a4b;--g3:#7e5b9e;--g4:#c77d0a;
    --person:#0a7d6b;--free:#b8520e;--now:#ffe9a8;--warn:#c0392b;
    --edit:#7a4ea8;--edit-d:#5e3a85;--edit-soft:#f0e9f7;--ok:#2c7a4b;--ok-soft:#e8f6ec;
    --shadow:0 1px 3px rgba(26,35,50,.06),0 8px 24px rgba(26,35,50,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 70px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{background:linear-gradient(135deg,#0b6e8f,#0a5570);color:#fff;
    padding:22px 0 20px;margin-bottom:20px;box-shadow:var(--shadow);transition:background .3s}
  header.edit-mode{background:linear-gradient(135deg,#7a4ea8,#5e3a85)}
  header .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:1.35rem;font-weight:700;letter-spacing:.02em}
  header .now{font-size:.76rem;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px}
  /* 学期トグル */
  .term-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;gap:2px}
  .term-toggle button{font-size:.9rem;font-weight:700;padding:7px 18px;border:none;background:transparent;
    color:rgba(255,255,255,.75);border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
  .term-toggle button.on{background:#fff;color:var(--accent)}
  header.edit-mode .term-toggle button.on{color:var(--edit)}
  .saved{margin-left:auto;font-size:.74rem;opacity:.9}
  .integ-badge{font-size:.74rem;font-weight:700;padding:4px 12px;border-radius:999px;cursor:pointer;transition:all .12s;white-space:nowrap}
  .integ-badge.ok{background:rgba(255,255,255,.2);color:#fff}
  .integ-badge.warn{background:#fff;color:var(--warn)}
  .integ-badge.warn:hover{background:#fff5ef}
  .integ-badge.ok:hover{background:rgba(255,255,255,.3)}
  .viewer-tag{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;background:#fff;color:var(--accent);letter-spacing:.05em}

  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{font-size:.9rem;font-weight:700;padding:10px 18px;border:1.5px solid var(--line);
    background:#fff;border-radius:10px 10px 0 0;cursor:pointer;color:var(--ink-soft);
    font-family:inherit;transition:all .15s;border-bottom:none}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab.on[data-tab=person]{background:var(--person);border-color:var(--person)}
  .tab.on[data-tab=free]{background:var(--free);border-color:var(--free)}
  body.term-late .tab.on[data-tab=class]{background:var(--edit);border-color:var(--edit)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:22px;box-shadow:var(--shadow)}
  .search-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search-row input{flex:1;min-width:200px;font-size:1rem;padding:12px 16px;border:1.5px solid var(--line);
    border-radius:10px;font-family:inherit;color:var(--ink)}
  .search-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-row .clear{font-size:.85rem;padding:11px 16px;border:1.5px solid var(--line);
    background:#fff;border-radius:10px;cursor:pointer;color:var(--ink-soft);font-family:inherit;white-space:nowrap}
  .search-row .clear:hover{border-color:var(--ink-soft);color:var(--ink)}
  .filters{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:start}
  .filter-label{font-size:.78rem;font-weight:700;color:var(--ink-soft);padding-top:7px;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:.82rem;padding:6px 13px;border:1.5px solid var(--line);background:#fff;
    border-radius:999px;cursor:pointer;color:var(--ink-soft);font-family:inherit;transition:all .12s;user-select:none}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.on.g1{background:var(--g1);border-color:var(--g1)}
  .chip.on.g2{background:var(--g2);border-color:var(--g2)}
  .chip.on.g3{background:var(--g3);border-color:var(--g3)}
  .chip.on.g4{background:var(--g4);border-color:var(--g4)}

  .mode-note{font-size:.8rem;color:var(--ink-soft);margin-bottom:14px;padding:9px 14px;
    background:var(--accent-soft);border-radius:8px;border:1px solid #cfe6ee}
  .mode-note b{color:var(--accent)}
  .mode-note.p{background:#e2f4f0;border-color:#bfe6dd}.mode-note.p b{color:var(--person)}
  .mode-note.f{background:#fbede0;border-color:#f0d9c2}.mode-note.f b{color:var(--free)}
  .mode-note.e{background:var(--edit-soft);border-color:#ddc9ef}.mode-note.e b{color:var(--edit-d)}

  .grid-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .grid-head .gtitle{font-size:1.15rem;font-weight:700}
  .grid-head .gworld{font-size:.9rem;color:var(--ink-soft)}
  .table-scroll{overflow-x:auto;border-radius:12px;box-shadow:var(--shadow)}
  table.week{border-collapse:collapse;width:100%;min-width:760px;background:var(--card)}
  table.week th,table.week td{border:1px solid var(--line);vertical-align:top}
  table.week thead th{background:#0b6e8f;color:#fff;font-size:.85rem;font-weight:700;padding:10px 8px;text-align:center}
  table.week.p thead th{background:var(--person)}
  table.week.e thead th{background:var(--edit)}
  table.week thead th.corner{background:#0a5570}
  table.week.p thead th.corner{background:#075a4d}
  table.week.e thead th.corner{background:var(--edit-d)}
  table.week thead th.todaycol{box-shadow:inset 0 -3px 0 var(--now)}
  table.week td.period-cell{background:var(--line-soft);text-align:center;font-weight:700;
    color:var(--ink);font-size:.8rem;padding:8px 6px;width:74px;white-space:nowrap}
  table.week td.period-cell .ptime{display:block;font-size:.66rem;color:var(--ink-soft);font-weight:500;margin-top:3px}
  table.week td.slot{padding:8px 9px;min-width:130px}
  table.week td.slot.empty{background:#fbfcfd}
  table.week td.nowcell{background:var(--now)!important;box-shadow:inset 0 0 0 2px #e0b73e}
  table.week.e td.slot{cursor:pointer;transition:background .1s}
  table.week.e td.slot:hover{background:var(--edit-soft)}
  .slot-card{font-size:.84rem}
  .slot-card .s-subj{font-weight:700;line-height:1.3;margin-bottom:4px}
  .slot-card .s-line{font-size:.76rem;color:var(--ink-soft);line-height:1.45}
  .slot-card .s-line b{color:var(--ink);font-weight:600}
  .slot-card .s-note{font-size:.7rem;color:var(--g4);font-weight:600;margin-top:3px}
  .slot-card+.slot-card{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .slot-empty-mark{text-align:center;color:#c4ccd6;font-size:1.3rem;line-height:1.1;padding:6px 0}
  table.week.e td.slot:hover .slot-empty-mark{color:var(--edit)}
  table.week.e td.slot.draggable{cursor:grab}
  table.week.e td.slot.draggable:active{cursor:grabbing}
  table.week.e td.slot.dragging{opacity:.4}
  table.week.e td.slot.drop-target{background:var(--edit-soft)!important;box-shadow:inset 0 0 0 2px var(--edit)}
  /* 選択科目 */
  .elective-tag{font-size:.62rem;font-weight:700;color:#fff;background:var(--g3);padding:1px 7px;border-radius:5px;display:inline-block;margin-bottom:5px}
  td.slot.elective{background:#faf7fd}
  .cell-list{background:var(--line-soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:14px}
  .cell-list .cl-head{font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .cell-list .cl-tag{font-size:.66rem;font-weight:700;color:#fff;background:var(--g3);padding:2px 8px;border-radius:5px}
  .cell-list .cl-item{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
    border-radius:8px;padding:7px 10px;margin-bottom:6px;cursor:pointer;transition:all .12s}
  .cell-list .cl-item:hover{border-color:var(--edit)}
  .cell-list .cl-item.active{border-color:var(--edit);background:var(--edit-soft)}
  .cell-list .cl-main{flex:1;font-size:.82rem;color:var(--ink-soft);line-height:1.35}
  .cell-list .cl-main b{color:var(--ink);font-weight:700}
  .cell-list .cl-edit,.cell-list .cl-del{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .cell-list .cl-edit{color:var(--edit)}.cell-list .cl-edit:hover{background:var(--edit-soft)}
  .cell-list .cl-del{color:var(--g1)}.cell-list .cl-del:hover{background:#fbeeec}
  .cell-list .cl-add{width:100%;font-size:.8rem;font-weight:700;color:var(--g3);background:#fff;
    border:1.5px dashed var(--g3);border-radius:8px;padding:8px;cursor:pointer;font-family:inherit;margin-top:2px}
  .cell-list .cl-add:hover{background:#faf7fd}
  .form-label{font-size:.78rem;font-weight:700;margin-bottom:10px;padding:7px 11px;border-radius:7px}
  .form-label .fl-edit{color:var(--edit)}.form-label .fl-add{color:var(--g3)}
  #formLabel{background:var(--edit-soft)}
  /* モーダル内 空き教室 */
  .freeroom-area{margin:-6px 0 14px;padding:10px 12px;background:#eef8f1;border:1px solid #c9e6d2;border-radius:9px}
  .freeroom-area .fr-head{font-size:.76rem;font-weight:700;color:var(--ok);margin-bottom:7px}
  .freeroom-area .fr-sub{font-size:.68rem;font-weight:500;color:var(--ink-soft);margin-left:5px}
  .freeroom-area .fr-list{display:flex;flex-wrap:wrap;gap:5px}
  .freeroom-area .fr-chip{font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:7px;
    border:1.5px solid #bfe0c9;background:#fff;color:var(--ink);cursor:pointer;transition:all .12s}
  .freeroom-area .fr-chip:hover{border-color:var(--ok);background:#f3fbf5}
  .freeroom-area .fr-chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .freeroom-area .fr-chip.special{border-color:#d8c9ea;background:#f7f3fc}
  .freeroom-area .fr-chip.special:hover{border-color:var(--g3)}
  .freeroom-area .fr-chip.special.on{background:var(--g3);border-color:var(--g3);color:#fff}
  .freeroom-area .fr-none{font-size:.78rem;color:var(--ink-soft)}
  .multi-grid{margin-bottom:26px}
  .multi-grid:last-child{margin-bottom:0}
  /* 時限別一覧 */
  .slot-table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .slot-table{border-collapse:collapse;width:100%;background:#fff;font-size:.85rem}
  .slot-table th{background:var(--accent);color:#fff;font-weight:700;padding:9px 11px;text-align:left;font-size:.8rem}
  .slot-table td{border-top:1px solid var(--line);padding:8px 11px;vertical-align:middle}
  .slot-table tr:hover td{background:var(--line-soft)}
  .slot-table tr.slot-dup td{background:#fdf1e7}
  .slot-table tr.slot-dup:hover td{background:#fbe5d4}
  .slot-table .dup-mark{font-size:.7rem;font-weight:700;color:var(--warn);margin-left:4px;white-space:nowrap}
  .slot-free{background:var(--ok-soft);border:1px solid #c9e6d2;border-radius:10px;padding:12px 14px}
  .slot-free-label{font-size:.82rem;font-weight:700;color:var(--ok);margin-bottom:8px}
  /* 教室別 */
  .room-free-mark{color:var(--ink-soft);font-size:.8rem;text-align:center;padding:6px 0;opacity:.6}
  table.week td.room-dup{background:#fdf1e7!important}
  table.week td.room-dup .dup-mark{font-size:.66rem;font-weight:700;color:var(--warn);margin-top:3px}

  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);transition:transform .12s}
  .card.g1{border-left-color:var(--g1)}.card.g2{border-left-color:var(--g2)}
  .card.g3{border-left-color:var(--g3)}.card.g4{border-left-color:var(--g4)}
  .card:hover{transform:translateY(-2px)}
  .card .subj{font-size:1.05rem;font-weight:700;margin-bottom:8px;line-height:1.35}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag{font-size:.72rem;padding:3px 9px;border-radius:6px;background:var(--line-soft);color:var(--ink-soft);font-weight:600}
  .tag.day{background:var(--accent-soft);color:var(--accent)}
  .tag.grade{color:#fff}
  .tag.grade.g1{background:var(--g1)}.tag.grade.g2{background:var(--g2)}
  .tag.grade.g3{background:var(--g3)}.tag.grade.g4{background:var(--g4)}
  .card .info{font-size:.85rem;color:var(--ink-soft);display:grid;gap:3px}
  .card .info b{color:var(--ink);font-weight:600;margin-right:5px}
  .card .note{font-size:.76rem;color:var(--g4);margin-top:7px;font-weight:600}
  mark{background:#fff4c2;color:inherit;padding:0 1px;border-radius:2px}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .pbtn{font-size:.85rem;padding:8px 15px;border:1.5px solid var(--line);background:#fff;
    border-radius:10px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .12s;display:flex;align-items:center;gap:7px}
  .pbtn:hover{border-color:var(--person);color:var(--person)}
  .pbtn.on{background:var(--person);border-color:var(--person);color:#fff}
  .pbtn .pg{font-size:.7rem;opacity:.8}

  /* 空き教室 */
  .free-grid{overflow-x:auto;border-radius:12px;box-shadow:var(--shadow)}
  .free-section{margin-bottom:18px}
  .fs-label{font-size:.82rem;font-weight:700;color:var(--g2);margin-bottom:9px;padding-left:10px;border-left:3px solid var(--g2)}
  .fs-label.busy-label{color:var(--ink-soft);border-left-color:var(--line)}
  .fs-none{font-size:.85rem;color:var(--ink-soft);padding:10px 14px;background:var(--line-soft);border-radius:8px}
  .room-list{display:flex;flex-wrap:wrap;gap:9px}
  .room-card{display:flex;flex-direction:column;gap:3px;min-width:96px;padding:11px 14px;
    border-radius:10px;border:1.5px solid #c9e6d2;background:#eef8f1;box-shadow:var(--shadow)}
  .room-card.special{border-color:#d8c9ea;background:#f3eefa}
  .room-card.busy-card{border-color:#eccfca;background:#fbeeec}
  .room-card .room-name{font-size:1rem;font-weight:700;color:var(--ink)}
  .room-card .room-busy{font-size:.72rem;color:#b9554a;font-weight:600}

  /* 編集系 */
  .edit-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
    padding:14px 16px;background:var(--edit-soft);border:1px solid #ddc9ef;border-radius:12px}
  .edit-toolbar .et-label{font-size:.85rem;font-weight:700;color:var(--edit-d)}
  .progress-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .pg-head{font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .pg-stat{font-size:.78rem;font-weight:500;color:var(--ink-soft)}
  .pg-scroll{overflow-x:auto}
  table.pg-table{border-collapse:collapse;min-width:520px}
  table.pg-table th,table.pg-table td{border:1px solid var(--line);padding:7px 10px;text-align:center;font-size:.82rem}
  table.pg-table thead th{background:var(--edit);color:#fff;font-weight:700;font-size:.78rem}
  table.pg-table thead th.pg-corner{background:var(--edit-d);text-align:left;white-space:nowrap}
  table.pg-table thead th.pg-sum{background:var(--edit-d)}
  table.pg-table td.pg-grade{background:var(--line-soft);font-weight:700;white-space:nowrap}
  table.pg-table td.pg-sum{background:var(--edit-soft);font-weight:700;color:var(--edit-d)}
  table.pg-table td.pg-na{background:#f3f4f7;color:#c4ccd6}
  table.pg-table td.pg-cell{cursor:pointer;font-weight:700;transition:filter .1s}
  table.pg-table td.pg-cell:hover{filter:brightness(.92)}
  table.pg-table td.pg-zero{background:#fff;color:#c4ccd6}
  table.pg-table td.pg-some{background:#fdf1e7;color:var(--warn)}
  table.pg-table td.pg-full{background:var(--ok-soft);color:var(--ok)}
  .pg-legend{font-size:.74rem;color:var(--ink-soft);margin-top:9px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .pg-legend .lg{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin:0 3px 0 8px;border:1px solid rgba(0,0,0,.08)}
  .pg-legend .lg.z{background:#fff}.pg-legend .lg.s{background:#fdf1e7}.pg-legend .lg.f{background:var(--ok-soft)}
  /* 整合チェック */
  .btn-sm{font-size:.78rem;padding:6px 13px;margin-left:auto}
  .check-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .ck-head{font-size:.92rem;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .ck-summary{font-size:.8rem;font-weight:500;color:var(--ink-soft);margin-left:auto}
  .ck-summary .ok{color:var(--ok);font-weight:700}.ck-summary .warn{color:var(--warn);font-weight:700}
  .ck-section{margin-bottom:14px}
  .ck-label{font-size:.82rem;font-weight:700;margin-bottom:8px;padding-left:10px;border-left:3px solid}
  .ck-label.warn{color:var(--warn);border-color:var(--warn)}
  .ck-label.info{color:var(--accent);border-color:var(--accent)}
  .ck-hint{font-size:.72rem;font-weight:400;color:var(--ink-soft);margin-left:8px}
  .ck-item{background:#fdf6ef;border:1px solid #f0d9c2;border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;transition:all .12s}
  .ck-item:hover{border-color:var(--warn);background:#fbeede}
  .ck-when{font-size:.82rem;font-weight:700;color:var(--warn);margin-bottom:4px}
  .ck-detail{font-size:.8rem;color:var(--ink-soft);line-height:1.5}
  .ck-detail b{color:var(--ink)}
  .ck-empty-group{font-size:.82rem;margin-bottom:8px}
  .ck-empty-group>b{color:var(--ink)}
  .ck-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .ck-chip{font-size:.74rem;font-weight:600;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s}
  .ck-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .ck-none{font-size:.85rem;color:var(--ink-soft);padding:10px 14px;background:var(--line-soft);border-radius:8px}
  .ck-none.ok{color:var(--ok);background:var(--ok-soft);font-weight:600}
  .btn{font-size:.88rem;font-weight:700;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
  .btn.edit{background:var(--edit);color:#fff}.btn.edit:hover{background:var(--edit-d)}
  .btn.ok{background:var(--ok);color:#fff}.btn.ok:hover{filter:brightness(.93)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
  .btn.ghost:hover{border-color:var(--edit);color:var(--edit)}
  .btn.danger-ghost{background:#fff;border:1.5px solid #e8c9c4;color:var(--g1)}
  .btn.danger-ghost:hover{background:#fbeeec}
  .empty{text-align:center;padding:54px 20px;color:var(--ink-soft)}
  .empty .big{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:6px}

  /* モーダル */
  .overlay{position:fixed;inset:0;background:rgba(26,35,50,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}

  /* ===== スマホ対応（閲覧中心） ===== */

  }
</style>

<script>
/* VIEWER_MODE: 開いたURLで自動判定。
   /edit を含むURL → 編集モード（フル機能）
   それ以外（トップなど）→ 閲覧専用モード
   ファイルを直接開いた場合（file://）は従来どおり編集モード */
var VIEWER_MODE=(location.protocol!=="file:")&&(location.pathname.indexOf("/edit")===-1)&&(location.search.indexOf("edit")===-1);
/* 閲覧版の学生用キー（?s=XXXX）。あれば学生別タブに本人の時間割だけを表示する */
var VIEWER_STUDENT_KEY=(function(){try{const m=location.search.match(/[?&]s=([a-z0-9]+)/i);return m?m[1]:null;}catch(e){return null;}})();
/* 学生キーの発行（ランダム12文字。URL判定と衝突しないよう "edit" を含む場合は作り直し） */
function genKey(){const cs="abcdefghijklmnopqrstuvwxyz0123456789";let s="";
  do{s="";try{const a=new Uint8Array(12);crypto.getRandomValues(a);for(let i=0;i<12;i++)s+=cs[a[i]%36];}
    catch(e){for(let i=0;i<12;i++)s+=cs[Math.floor(Math.random()*36)];}}while(s.indexOf("edit")!==-1);
  return s;}

// GENに編集差分を適用した「表示用の前期データ」を生成
function earlyData(){
  const keyOf=r=>[r.grade,r.world,r.day,r.period].join("|");
  const out=[];
  // 編集差分のあるキーは差分を優先、ないキーはGENをそのまま
  const editedKeys=new Set(Object.keys(earlyEdits));
  const genByKey={};
  GEN.forEach(r=>{const k=keyOf(r);(genByKey[k]=genByKey[k]||[]).push(r);});
  // GEN由来（編集が無い枠）
  Object.keys(genByKey).forEach(k=>{
    if(editedKeys.has(k))return; // 編集ありは後でまとめて出す
    genByKey[k].forEach(r=>out.push(r));
  });
  // 編集差分のある枠
  editedKeys.forEach(k=>{const e=earlyEdits[k];
    if(e.type==="delete")return;
    if(e.type==="edit")out.push(e.data);
    else if(e.type==="editMulti")e.list.forEach(r=>out.push(r));
  });
  return out;
}

function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function hl(s,q){if(!q||!s)return esc(s||"");const i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(s);return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));}
function worldShortFull(w){let s=w.replace(/（[^）]*）/g,"");
  s=s.replace("ブライダルワールド【プランナーコース】","ブライダル(プランナー)");
  s=s.replace("ブライダルワールド【ドレスコーディネーターコース】","ブライダル(ドレス)");
  return s.replace("ワールド","").trim();}
function worldRank(w){for(let i=0;i<WORLD_ORDER.length;i++){const p=WORLD_ORDER[i];
  if(p.includes("プランナー")&&w.includes("プランナー"))return i;
  if(p.includes("ドレス")&&w.includes("ドレス"))return i;
  if(!p.includes("【")&&w.startsWith(p.replace("ワールド",""))&&!w.includes("【"))return i;}return 99;}

function nowInfo(){const d=new Date(),min=d.getHours()*60+d.getMinutes();
  const dayMap={1:"月",2:"火",3:"水",4:"木",5:"金"};const day=dayMap[d.getDay()]||null;

const SG_SOURCES={mSubject:OPT.subjects,mTeacher:OPT.teachers,mRoom:OPT.rooms_clean};
const SG_LISTS={mSubject:"sgSubject",mTeacher:"sgTeacher",mRoom:"sgRoom"};
function setupSuggest(inputId){
  const input=document.getElementById(inputId);
  const list=document.getElementById(SG_LISTS[inputId]);
  const source=SG_SOURCES[inputId];
  let activeIdx=-1;
  function render(){
    const q=input.value.trim();
    if(!q){list.classList.remove("show");list.innerHTML="";activeIdx=-1;return;}
    const ql=q.toLowerCase();
    // 前方一致を優先し、部分一致を後ろに
    const starts=[],contains=[];
    source.forEach(v=>{const vl=v.toLowerCase();
      if(vl===ql)return; // 完全一致は候補に出さない（既に入力済み）
      if(vl.startsWith(ql))starts.push(v);else if(vl.includes(ql))contains.push(v);});
    const matches=[...starts,...contains].slice(0,8);
    if(!matches.length){list.classList.remove("show");list.innerHTML="";activeIdx=-1;return;}
    list.innerHTML=matches.map((v,i)=>{
      const idx=v.toLowerCase().indexOf(ql);
      const html=idx>=0?esc(v.slice(0,idx))+'<span class="sg-hl">'+esc(v.slice(idx,idx+q.length))+'</span>'+esc(v.slice(idx+q.length)):esc(v);
      return `<div class="sg-item" data-v="${esc(v)}" data-i="${i}">${html}</div>`;
    }).join("");
    list.classList.add("show");activeIdx=-1;
    list.querySelectorAll(".sg-item").forEach(it=>{
      it.onmousedown=e=>{e.preventDefault();input.value=it.dataset.v;list.classList.remove("show");list.innerHTML="";input.focus();
        if(inputId==="mSubject")updateCopyArea();
        updateConflict();if(inputId==="mRoom")updateFreeRooms();};
    });
  }
  input.addEventListener("input",()=>{render();if(inputId==="mSubject")updateCopyArea();
    updateConflict();if(inputId==="mRoom")updateFreeRooms();});
  input.addEventListener("focus",render);
  input.addEventListener("blur",()=>setTimeout(()=>list.classList.remove("show"),120));
  input.addEventListener("keydown",e=>{
    const items=list.querySelectorAll(".sg-item");
    if(!list.classList.contains("show")||!items.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);}
    else if(e.key==="ArrowUp"){e.preventDefault();activeIdx=Math.max(activeIdx-1,0);}
    else if(e.key==="Enter"){if(activeIdx>=0){e.preventDefault();input.value=items[activeIdx].dataset.v;list.classList.remove("show");if(inputId==="mSubject")updateCopyArea();return;}}
    else if(e.key==="Escape"){list.classList.remove("show");return;}
    else return;
    items.forEach((it,i)=>it.classList.toggle("active",i===activeIdx));
    if(activeIdx>=0)items[activeIdx].scrollIntoView({block:"nearest"});
  });
}
["mSubject","mTeacher","mRoom"].forEach(setupSuggest);

    if(!q){list.classList.remove("show");list.innerHTML="";activeIdx=-1;return;}
    const ql=q.toLowerCase();const starts=[],contains=[];
    source.forEach(v=>{const vl=v.toLowerCase();if(vl===ql)return;
      if(vl.startsWith(ql))starts.push(v);else if(vl.includes(ql))contains.push(v);});
    const matches=[...starts,...contains].slice(0,8);
    if(!matches.length){list.classList.remove("show");list.innerHTML="";activeIdx=-1;return;}
    list.innerHTML=matches.map((v,i)=>{const idx=v.toLowerCase().indexOf(ql);
      const html=idx>=0?esc(v.slice(0,idx))+'<span class="sg-hl">'+esc(v.slice(idx,idx+q.length))+'</span>'+esc(v.slice(idx+q.length)):esc(v);
      return `<div class="sg-item" data-v="${esc(v)}" data-i="${i}">${html}</div>`;}).join("");
    list.classList.add("show");activeIdx=-1;
    list.querySelectorAll(".sg-item").forEach(it=>{it.onmousedown=e=>{e.preventDefault();input.value=it.dataset.v;list.classList.remove("show");list.innerHTML="";input.focus();};});
  }
  input.addEventListener("input",render);
  input.addEventListener("focus",render);
  input.addEventListener("blur",()=>setTimeout(()=>list.classList.remove("show"),120));
  input.addEventListener("keydown",e=>{const items=list.querySelectorAll(".sg-item");
    if(!list.classList.contains("show")||!items.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);}
    else if(e.key==="ArrowUp"){e.preventDefault();activeIdx=Math.max(activeIdx-1,0);}
    else if(e.key==="Enter"){if(activeIdx>=0){e.preventDefault();input.value=items[activeIdx].dataset.v;list.classList.remove("show");return;}}
    else if(e.key==="Escape"){list.classList.remove("show");return;}
    else return;
    items.forEach((it,i)=>it.classList.toggle("active",i===activeIdx));
    if(activeIdx>=0)items[activeIdx].scrollIntoView({block:"nearest"});});
}

// ===== コピー機能：同名授業の教員・教室をまとめて流用 =====
function updateCopyArea(){
  const area=document.getElementById("copyArea");
  const subj=document.getElementById("mSubject").value.trim();
  if(!subj){area.style.display="none";area.innerHTML="";return;}
  // 前期・後期から同名授業を収集（教員・教室の組み合わせで重複排除）
  const seen=new Set();const cands=[];
  // クラス分け表記など教員名でない値を弾く
  function looksLikeTeacher(t){if(!t)return true;return !(t.includes("：")||t.includes(":"))&&!/^[0-9０-９\s・\/／]+$/.test(t);}
  function collect(arr,src){arr.forEach(r=>{
    if(r.subject!==subj)return;
    if(!r.teacher&&!r.room)return;
    if(!looksLikeTeacher(r.teacher))return; // 教員欄がノイズの候補は出さない
    const key=src+"|"+(r.teacher||"")+"|"+(r.room||"")+"|"+(r.note||"");
    if(seen.has(key))return;seen.add(key);
    cands.push({src,teacher:r.teacher||"",room:r.room||"",note:r.note||""});});}
  collect(GEN,"early");
  collect(lateRecords,"late");
  // 現在の入力欄と完全一致する候補は除く
  const curT=document.getElementById("mTeacher").value.trim(),curR=document.getElementById("mRoom").value.trim();
  const filtered=cands.filter(c=>!(c.teacher===curT&&c.room===curR));
  if(!filtered.length){area.style.display="none";area.innerHTML="";return;}
  area.style.display="";
  const SRC_LABEL={early:"前期",late:"後期"};
  area.innerHTML=`<div class="ca-title"><span class="ca-badge">コピー</span>同じ「${esc(subj)}」の登録内容（クリックで教員・教室を反映）</div>
    <div class="copy-list">`+filtered.slice(0,6).map((c,i)=>{
      const parts=[];if(c.teacher)parts.push("講師: <b>"+esc(c.teacher)+"</b>");if(c.room)parts.push("教室: <b>"+esc(c.room)+"</b>");
      return `<div class="copy-item" data-i="${i}"><span class="ci-arrow">⎘</span><span class="ci-main">${parts.join(" ／ ")}${c.note?'<br><span style="color:var(--g4);font-size:.72rem">備考: '+esc(c.note)+'</span>':""}</span><span class="ci-src ${c.src}">${SRC_LABEL[c.src]}</span></div>`;
    }).join("")+`</div>`;
  area.querySelectorAll(".copy-item").forEach(it=>{
    const c=filtered[+it.dataset.i];
    it.onclick=()=>{
      if(c.teacher)document.getElementById("mTeacher").value=c.teacher;
      if(c.room)document.getElementById("mRoom").value=c.room;
      if(c.note&&!document.getElementById("mNote").value.trim())document.getElementById("mNote").value=c.note;
      updateCopyArea();
    };
  });
}

// ===== 教室の重複チェック（同名科目は合同としてOK、異なる科目は警告） =====
// 入力中の教室が、同じ後期・同じ曜日・同じ時限で、別の科目に使われていないか調べる
function roomConflicts(){
  const room=document.getElementById("mRoom").value.trim();
  const subj=document.getElementById("mSubject").value.trim();
  if(!room||!editing)return{joint:[],clash:[]};
  const {day,period}=editing;
  // 入力中の教室を正規化（複合表記も分解して比較）
  const targets=normRooms(room);
  // 正規化できない（候補にない自由入力）場合は、文字列そのものでも比較
  const rawTarget=room;
  const joint=[],clash=[];
  classData().forEach(r=>{
    if(r.day!==day||r.period!==period)return;
    // 今まさに編集しているそのコマ自身は除外
    if(r.grade===editGrade()&&worldShortFull(r.world)===cstate.world)return;
    if(!r.room)return;
    const rRooms=normRooms(r.room);
    const overlap=targets.some(t=>rRooms.includes(t))||(rRooms.length===0&&r.room.trim()===rawTarget)||(targets.length===0&&rRooms.includes(rawTarget));
    if(!overlap)return;
    const info={grade:r.grade,world:worldShortFull(r.world),subject:r.subject,room:r.room,teacher:r.teacher};
    if(subj&&r.subject===subj)joint.push(info);else clash.push(info);
  });
  return{joint,clash};
}
// 教員の重複：同じ後期・同じ曜日・時限で、別の科目に同じ先生が入っていないか
function teacherConflicts(){
  const teacher=document.getElementById("mTeacher").value.trim();
  const subj=document.getElementById("mSubject").value.trim();
  if(!teacher||!editing)return{joint:[],clash:[]};
  // クラス分け表記や総称（複数人を指す名称）はチェックしない
  if(teacher.includes("：")||teacher.includes(":"))return{joint:[],clash:[]};
  const GENERIC=["ILC","担任","各担任","講師","各講師","担当","各担当","外部講師","ゲスト講師"];
  if(GENERIC.includes(teacher))return{joint:[],clash:[]};
  const {day,period}=editing;
  const joint=[],clash=[];
  classData().forEach(r=>{
    if(r.day!==day||r.period!==period)return;
    if(r.grade===editGrade()&&worldShortFull(r.world)===cstate.world)return;
    if(!r.teacher)return;
    // 複数担当「A／B」表記も分解して比較
    const rTeachers=r.teacher.split(/[／/]/).map(s=>s.trim());
    if(!rTeachers.includes(teacher))return;
    const info={grade:r.grade,world:worldShortFull(r.world),subject:r.subject,room:r.room,teacher:r.teacher};
    if(subj&&r.subject===subj)joint.push(info);else clash.push(info);
  });
  return{joint,clash};
}
// 編集中の枠（曜日・時限）に、学校全体で空いている教室を表示
function updateFreeRooms(){
  const area=document.getElementById("freeRoomArea");
  if(!editing){area.style.display="none";return;}
  const {day,period}=editing;
  // 学校全体（全学年・全ワールド）の使用状況。ただし今編集中の枠自身は除外
  const usedKey=day+"-"+period;
  const usedRooms=new Set();
  classData().forEach(r=>{
    if(r.day!==day||r.period!==period)return;
    // 今編集している枠（同じ学年×ワールド×曜日×時限）は除外
    if(r.grade===editGrade()&&worldShortFull(r.world)===cstate.world)return;
    normRooms(r.room).forEach(rm=>usedRooms.add(rm));
  });
  const freeNormal=ROOMS.filter(rm=>roomCat(rm)==="normal"&&!usedRooms.has(rm));
  const freeSpecial=ROOMS.filter(rm=>roomCat(rm)==="special"&&!usedRooms.has(rm));
  const cur=document.getElementById("mRoom").value.trim();
  function chip(rm){const on=normRooms(cur).includes(rm);
    return `<span class="fr-chip${on?' on':''}${roomCat(rm)==='special'?' special':''}" data-room="${esc(rm)}">${esc(rm)}</span>`;}
  let html=`<div class="fr-head">${day}曜${period}限に空いている教室 <span class="fr-sub">クリックで入力</span></div>`;
  if(freeNormal.length)html+=`<div class="fr-list">${freeNormal.map(chip).join("")}</div>`;
  else html+=`<div class="fr-none">空いている一般教室はありません</div>`;
  if(freeSpecial.length)html+=`<div class="fr-list" style="margin-top:5px">${freeSpecial.map(chip).join("")}</div>`;
  area.innerHTML=html;area.style.display="";
  area.querySelectorAll(".fr-chip").forEach(c=>c.onclick=()=>{
    document.getElementById("mRoom").value=c.dataset.room;
    updateConflict();updateFreeRooms();});
}
function updateConflict(){
  const area=document.getElementById("conflictArea");
  const {day,period}=editing||{};
  if(!day){area.style.display="none";return;}
  const room=document.getElementById("mRoom").value.trim();
  const teacher=document.getElementById("mTeacher").value.trim();
  const rc=roomConflicts(),tc=teacherConflicts();
  const roomClash=room?rc.clash:[],roomJoint=room?rc.joint:[];
  const teaClash=teacher?tc.clash:[],teaJoint=teacher?tc.joint:[];
  if(!roomClash.length&&!roomJoint.length&&!teaClash.length&&!teaJoint.length){area.style.display="none";area.innerHTML="";return;}
  area.style.display="";
  let html="";
  // 警告（別科目との重複）を優先表示
  if(roomClash.length){
    html+=`<div class="cf-block warn"><div class="cf-title"><span class="cf-badge">教室重複</span>${esc(day)}曜${period}限の「${esc(room)}」は別の授業で使用中</div>`+
      roomClash.map(c=>`<div class="cf-row"><b>${c.grade}年 ${esc(c.world)}</b>：${esc(c.subject)}${c.teacher?`（${esc(c.teacher)}）`:""}</div>`).join("")+`</div>`;
  }
  if(teaClash.length){
    html+=`<div class="cf-block warn"><div class="cf-title"><span class="cf-badge">教員重複</span>${esc(teacher)} 先生は同じ時間に別の授業を担当しています</div>`+
      teaClash.map(c=>`<div class="cf-row"><b>${c.grade}年 ${esc(c.world)}</b>：${esc(c.subject)}${c.room?`（${esc(c.room)}）`:""}</div>`).join("")+`</div>`;
  }
  // 合同（同名科目）の案内
  if(roomJoint.length){
    html+=`<div class="cf-block okjoint"><div class="cf-title"><span class="cf-badge">合同</span>同じ「${esc(roomJoint[0].subject)}」が同じ教室で開講中</div>`+
      roomJoint.map(c=>`<div class="cf-row"><b>${c.grade}年 ${esc(c.world)}</b>：${esc(c.room)}</div>`).join("")+`</div>`;
  }
  if(teaJoint.length&&!roomJoint.length){
    html+=`<div class="cf-block okjoint"><div class="cf-title"><span class="cf-badge">合同</span>${esc(teacher)} 先生が同じ「${esc(teaJoint[0].subject)}」を担当中</div>`+
      teaJoint.map(c=>`<div class="cf-row"><b>${c.grade}年 ${esc(c.world)}</b></div>`).join("")+`</div>`;
  }
  const anyClash=roomClash.length||teaClash.length;
  html+=`<div class="cf-foot ${anyClash?'warn':'ok'}">${anyClash?'別の科目との重複があります。変更するか、このまま登録するか選べます。':'同じ科目なので合同として扱えます。このまま登録できます。'}</div>`;
  area.className="conflict-area "+(anyClash?"warn":"okjoint");
  area.innerHTML=html;
}

function slotCardHTML(r,q){return `<div class="slot-card"><div class="s-subj">${hl(r.subject,q)}</div>${r.teacher?`<div class="s-line"><b>講師</b> ${hl(r.teacher,q)}</div>`:""}${r.room?`<div class="s-line"><b>教室</b> ${hl(r.room,q)}</div>`:""}${r.note?`<div class="s-note">${esc(r.note)}</div>`:""}</div>`;}

function buildGrid(rows,q,opts){opts=opts||{};
  const cols=opts.day?[opts.day]:DAYS;const prows=opts.period?[opts.period]:PERIODS;
  const map={};rows.forEach(r=>{(map[r.day+"-"+r.period]=map[r.day+"-"+r.period]||[]).push(r);});
  const pcls=opts.cls?(" "+opts.cls):"";const editable=opts.editable;
  const gAttr=(opts.grade!=null)?` data-g="${opts.grade}"`:"";
  let thead='<tr><th class="corner">時限</th>'+cols.map(d=>`<th class="${d===NOW.day?'todaycol':''}">${d}</th>`).join("")+'</tr>';
  let tbody=prows.map(p=>{const time=(rows.find(r=>r.period===p)||{}).time||PTIME[p];
    let tds=cols.map(d=>{const cell=map[d+"-"+p];const isNow=(d===NOW.day&&p===NOW.period);const nc=isNow?" nowcell":"";
      const attr=editable?` data-d="${d}" data-p="${p}"${gAttr}`:"";
      if(!cell)return editable?`<td class="slot empty${nc}"${attr}><div class="slot-empty-mark">＋</div></td>`:`<td class="slot empty${nc}"></td>`;
      // 1枠に2件以上＝選択科目として「選択」ラベルを付ける
      const multi=cell.length>1;
      const inner=(multi?'<div class="elective-tag">選択科目</div>':"")+cell.map(r=>slotCardHTML(r,q)).join("");
      return `<td class="slot${nc}${multi?' elective':''}"${attr}>`+inner+'</td>';
    }).join("");
    return `<tr><td class="period-cell">${p}限<span class="ptime">${time}</span></td>${tds}</tr>`;
  }).join("");
  return `<div class="table-scroll"><table class="week${pcls}"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
}

const cstate={q:"",grade:null,world:null,day:null,period:null};
let worldGroups=[];
function rebuildWorldChips(){
  // 前期は実在ワールド、後期は学年別の全ワールド（空でも編集できるように）
  // 学年が選択されていればその学年のワールドのみ表示
  let ws;
  if(cstate.grade){
    ws=(OPT.world_by_grade[String(cstate.grade)]||[]).slice();
    if(!isLate()){
      // 前期は実データに存在するものだけ
      const exist=new Set(classData().filter(r=>r.grade===cstate.grade).map(r=>r.world));
      ws=ws.filter(w=>exist.has(w));
    }
  }else if(isLate()){
    const all=new Set();Object.values(OPT.world_by_grade).forEach(arr=>arr.forEach(w=>all.add(w)));ws=[...all];
  }else{
    ws=[...new Set(classData().map(r=>r.world))];
  }
  worldGroups=[...new Set(ws.map(worldShortFull))];
  worldGroups.sort((a,b)=>{
    const fa=ws.find(w=>worldShortFull(w)===a),fb=ws.find(w=>worldShortFull(w)===b);
    return worldRank(fa)-worldRank(fb);});
  const el=document.getElementById("worldChips");el.innerHTML="";
  worldGroups.forEach(w=>{const c=document.createElement("div");c.className="chip";c.textContent=w;
    c.dataset.val=w;c.dataset.key="world";
    if(cstate.world===w)c.classList.add("on");
    c.onclick=()=>{cstate.world=(cstate.world===w)?null:w;renderClass();refreshChips("#classPanel",cstate);};el.appendChild(c);});
}

    c.textContent=it.label;c.onclick=()=>{st[key]=(st[key]===it.val)?null:it.val;fn();};
    c.dataset.val=it.val;c.dataset.key=key;if(cls)c.dataset.cls=cls(it);el.appendChild(c);});}
makeChips("gradeChips",[1,2,3,4].map(g=>({label:g+"年",val:g})),"grade",it=>"g"+it.val,cstate,()=>{

let progressOpen=false;
function renderProgress(){
  const panel=document.getElementById("progressPanel");if(!panel)return;
  if(!progressOpen){panel.innerHTML="";return;}
  // 学年×ワールドのマトリクス。各セルは登録コマ数。クリックでそのワールドへ移動
  const grades=[1,2,3,4];
  // 全ワールド短縮名（出現順）
  const allShort=[];
  Object.values(OPT.world_by_grade).forEach(arr=>arr.slice().sort((a,b)=>worldRank(a)-worldRank(b)).forEach(w=>{const s=worldShortFull(w);if(!allShort.includes(s))allShort.push(s);}));
  function cellCount(g,wShort){return lateRecords.filter(r=>r.grade===g&&worldShortFull(r.world)===wShort).length;}
  function exists(g,wShort){return (OPT.world_by_grade[String(g)]||[]).some(w=>worldShortFull(w)===wShort);}
  let total=0,filled=0;
  let thead='<tr><th class="pg-corner">学年＼ワールド</th>'+allShort.map(w=>`<th>${esc(w)}</th>`).join("")+'<th class="pg-sum">計</th></tr>';
  let tbody=grades.map(g=>{
    let rowSum=0;
    let tds=allShort.map(w=>{
      if(!exists(g,w))return '<td class="pg-na">—</td>';
      const n=cellCount(g,w);rowSum+=n;total++;if(n>0)filled++;
      const cls=n===0?"pg-zero":(n>=10?"pg-full":"pg-some");
      return `<td class="pg-cell ${cls}" data-g="${g}" data-w="${esc(w)}">${n}</td>`;
    }).join("");
    return `<tr><td class="pg-grade">${g}年</td>${tds}<td class="pg-sum">${rowSum}</td></tr>`;
  }).join("");
  panel.innerHTML=`<div class="progress-box">

  </div>`;
  panel.querySelectorAll(".pg-cell").forEach(td=>{td.onclick=()=>{

  };});
}

let checkOpen=false;
// 全体の整合チェック：教室重複・教員重複・空きコマを点検（現在の学期データ）
function runIntegrityCheck(){
  const roomClashes=[],teacherClashes=[];
  const allData=classData();
  // 曜日×時限ごとにグルーピング
  const bySlot={};
  allData.forEach(r=>{const k=r.day+"-"+r.period;(bySlot[k]=bySlot[k]||[]).push(r);});
  // 総称（複数人を指す名称）は重複判定から除外
  const GENERIC_TEACHERS=["ILC","担任","各担任","講師","各講師","担当","各担当","外部講師","ゲスト講師"];
  function teacherList(t){return (t||"").split(/[／/]/).map(s=>s.trim()).filter(s=>s&&!s.includes("：")&&!s.includes(":")&&!GENERIC_TEACHERS.includes(s));}
  Object.keys(bySlot).forEach(k=>{
    const recs=bySlot[k];const [day,period]=k.split("-");
    const cellKey=r=>[r.grade,r.world].join("|"); // 同じ枠（学年×ワールド）の識別
    // 教室重複：教室→[レコード]。同名科目は合同。同じ枠内（選択科目）は除外
    const roomMap={};
    recs.forEach(r=>{normRooms(r.room).forEach(rm=>{(roomMap[rm]=roomMap[rm]||[]).push(r);});});
    Object.keys(roomMap).forEach(rm=>{
      const list=roomMap[rm];
      const subjects=[...new Set(list.map(r=>r.subject))];
      const cells=[...new Set(list.map(cellKey))];
      // 別々の枠で、2種類以上の科目が同教室＝重複（同じ枠だけなら選択科目なので除外）
      if(subjects.length>1&&cells.length>1){
        roomClashes.push({day,period:+period,room:rm,items:list.map(r=>({grade:r.grade,world:worldShortFull(r.world),subject:r.subject,teacher:r.teacher}))});
      }
    });
    // 教員重複：同名科目は合同、同じ枠内は除外
    const teaMap={};
    recs.forEach(r=>{teacherList(r.teacher).forEach(t=>{(teaMap[t]=teaMap[t]||[]).push(r);});});
    Object.keys(teaMap).forEach(t=>{
      const list=teaMap[t];const subjects=[...new Set(list.map(r=>r.subject))];
      const cells=[...new Set(list.map(cellKey))];
      if(subjects.length>1&&cells.length>1){
        teacherClashes.push({day,period:+period,teacher:t,items:list.map(r=>({grade:r.grade,world:worldShortFull(r.world),subject:r.subject,room:r.room}))});
      }
    });
  });
  // 空きコマ：登録済みの学年×ワールドについて、5日×5限のうち未入力のもの
  const filledWorlds=[...new Set(allData.map(r=>r.grade+"|"+r.world))];
  const emptySlots=[];
  filledWorlds.forEach(key=>{
    const [g,world]=key.split("|");
    DAYS.forEach(d=>PERIODS.forEach(p=>{
      const has=allData.some(r=>r.grade===+g&&r.world===world&&r.day===d&&r.period===p);
      if(!has)emptySlots.push({grade:+g,world:worldShortFull(world),fullWorld:world,day:d,period:p});
    }));
  });
  return {roomClashes,teacherClashes,emptySlots,filledWorlds:filledWorlds.length};
}
function renderCheck(){
  const panel=document.getElementById("checkPanel");if(!panel)return;
  if(!checkOpen){panel.innerHTML="";return;}
  const termL=term==="early"?"前期":"後期";
  if(!classData().length){panel.innerHTML=`<div class="check-box"><div class="ck-head">整合チェック</div><div class="ck-none">まだ${termL}の授業がありません。</div></div>`;return;}
  const {roomClashes,teacherClashes,emptySlots}=runIntegrityCheck();
  const totalIssues=roomClashes.length+teacherClashes.length;
  let html='<div class="check-box"><div class="ck-head">整合チェック結果（'+termL+'）';
  html+=`<span class="ck-summary">${totalIssues===0?'<span class="ok">重複なし ✓</span>':'<span class="warn">重複 '+totalIssues+' 件</span>'}　空きコマ ${emptySlots.length} 件</span></div>`;
  // 教室重複
  if(roomClashes.length){
    html+='<div class="ck-section"><div class="ck-label warn">教室の重複（'+roomClashes.length+'件）</div>';
    html+=roomClashes.map(c=>`<div class="ck-item" data-g="${c.items[0].grade}" data-w="${esc(c.items[0].world)}"><div class="ck-when">${c.day}曜${c.period}限・${esc(c.room)}</div>`+
      c.items.map(it=>`<div class="ck-detail"><b>${it.grade}年 ${esc(it.world)}</b>：${esc(it.subject)}${it.teacher?`（${esc(it.teacher)}）`:""}</div>`).join("")+`</div>`).join("");
    html+='</div>';
  }
  // 教員重複
  if(teacherClashes.length){
    html+='<div class="ck-section"><div class="ck-label warn">教員の重複（'+teacherClashes.length+'件）</div>';
    html+=teacherClashes.map(c=>`<div class="ck-item" data-g="${c.items[0].grade}" data-w="${esc(c.items[0].world)}"><div class="ck-when">${c.day}曜${c.period}限・${esc(c.teacher)} 先生</div>`+
      c.items.map(it=>`<div class="ck-detail"><b>${it.grade}年 ${esc(it.world)}</b>：${esc(it.subject)}${it.room?`（${esc(it.room)}）`:""}</div>`).join("")+`</div>`).join("");
    html+='</div>';
  }
  // 空きコマ（多いので学年×ワールド単位でまとめ、件数表示＋展開）
  if(emptySlots.length){
    const byWorld={};emptySlots.forEach(e=>{const k=e.grade+"|"+e.world;(byWorld[k]=byWorld[k]||[]).push(e);});
    html+='<div class="ck-section"><div class="ck-label info">空きコマ（'+emptySlots.length+'件）<span class="ck-hint">各コマをクリックでその枠へ移動</span></div>';
    Object.keys(byWorld).forEach(k=>{
      const list=byWorld[k];const [g,w]=k.split("|");
      html+=`<div class="ck-empty-group"><b>${g}年 ${esc(w)}</b>（${list.length}コマ）<div class="ck-chips">`+
        list.map(e=>`<span class="ck-chip" data-g="${e.grade}" data-w="${esc(e.world)}" data-d="${e.day}" data-p="${e.period}">${e.day}${e.period}</span>`).join("")+`</div></div>`;
    });
    html+='</div>';
  }
  if(totalIssues===0&&!emptySlots.length){
    html+='<div class="ck-none ok">重複も空きコマもありません。配布前の状態として問題ありません ✓</div>';
  }
  html+='</div>';
  panel.innerHTML=html;
  // 重複項目クリックでその枠へ
  panel.querySelectorAll(".ck-item").forEach(it=>{it.onclick=()=>{
    cstate.grade=+it.dataset.g;cstate.world=it.dataset.w;
    rebuildWorldChips();refreshChips("#classPanel",cstate);renderClass();
    document.getElementById("classOut").scrollIntoView({behavior:"smooth",block:"start"});
  };});
  panel.querySelectorAll(".ck-chip").forEach(ch=>{ch.onclick=()=>{
    cstate.grade=+ch.dataset.g;cstate.world=ch.dataset.w;cstate.day=ch.dataset.d;cstate.period=+ch.dataset.p;
    rebuildWorldChips();refreshChips("#classPanel",cstate);renderClass();
    document.getElementById("classOut").scrollIntoView({behavior:"smooth",block:"start"});
  };});
}

// 印刷用ビュー：現在表示中の週間表を、印刷に適したレイアウトの別ウィンドウで開く
// 印刷用テーブル生成（ツール本体の週間表と同じ見た目）
// theme: ヘッダー色などのテーマ（accent=青/edit=紫/person=緑）。nowDay/nowPeriodで現在コマを黄色表示
function buildPrintTable(title,sub,rows,theme){
  const map={};rows.forEach(r=>{(map[r.day+"-"+r.period]=map[r.day+"-"+r.period]||[]).push(r);});
  let thead='<tr><th class="corner">時限</th>'+DAYS.map(d=>`<th${d===NOW.day?' class="todaycol"':''}>${d}</th>`).join("")+'</tr>';
  let tbody=PERIODS.map(p=>{
    const time=(rows.find(r=>r.period===p)||{}).time||PTIME_FULL[p];
    let tds=DAYS.map(d=>{const cell=map[d+"-"+p];const isNow=(d===NOW.day&&p===NOW.period);
      const cls=(cell?"slot":"slot empty")+(isNow?" nowcell":"");
      if(!cell)return `<td class="${cls}"></td>`;
      return `<td class="${cls}">`+cell.map(r=>`<div class="slot-card"><div class="s-subj">${escP(r.subject)}</div>${r.teacher?`<div class="s-line"><b>講師</b> ${escP(r.teacher)}</div>`:""}${r.room?`<div class="s-line"><b>教室</b> ${escP(r.room)}</div>`:""}${r.note?`<div class="s-note">${escP(r.note)}</div>`:""}</div>`).join("")+'</td>';
    }).join("");
    return `<tr><td class="period-cell">${p}限<span class="ptime">${escP(time)}</span></td>${tds}</tr>`;
  }).join("");
  return `<div class="sheet"><div class="grid-head"><span class="gtitle">${escP(title)}</span><span class="gworld">${escP(sub)}</span></div><div class="table-scroll"><table class="week theme-${theme}"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div></div>`;
}
function escP(s){return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

    :root{--ink:#1a2332;--ink-soft:#5a6478;--line:#dde3ec;--line-soft:#eef1f6;--now:#ffe9a8;--g4:#c77d0a;
      --accent:#0b6e8f;--accent-d:#0a5570;--edit:#7a4ea8;--edit-d:#5e3a85;--person:#0a7d6b;--person-d:#075a4d;}

    .sheet{margin-bottom:22px}

    table.week{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}

    rows.sort((a,b)=>a.grade-b.grade||DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.period-b.period);
    out.innerHTML='<div class="results">'+rows.map(r=>{const g="g"+r.grade;return `<div class="card ${g}"><div class="subj">${hl(r.subject,q)}</div><div class="meta"><span class="tag grade ${g}">${r.grade}年</span><span class="tag">${worldShortFull(r.world)}</span><span class="tag day">${r.day} ${r.period}限</span></div><div class="info"><div><b>時間</b>${r.time||PTIME_FULL[r.period]}</div>${r.teacher?`<div><b>担当</b>${hl(r.teacher,q)}</div>`:""}${r.room?`<div><b>教室</b>${hl(r.room,q)}</div>`:""}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}</div>`;}).join("")+'</div>';
  }

function fullWorldName(grade,shortName){
  const ws=OPT.world_by_grade[String(grade)]||[];
  return ws.find(w=>worldShortFull(w)===shortName)||shortName;
}
function bindEditCells(){
  document.querySelectorAll("#classOut td.slot[data-d]").forEach(td=>{
    const d=td.dataset.d,p=+td.dataset.p;
    const g=(td.dataset.g!=null&&td.dataset.g!=="")?+td.dataset.g:cstate.grade;
    const rec=findLate(g,cstate.world,d,p);
    // クリックで編集（そのセルの学年で開く）
    td.onclick=(e)=>{if(td._dragging)return;openModal(d,p,g);};
    // 授業が入っているセルはドラッグ可能（移動）
    if(rec){
      td.setAttribute("draggable","true");
      td.classList.add("draggable");
      td.ondragstart=(e)=>{td._dragging=true;dragSrc={day:d,period:p,grade:g};
        e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",d+"-"+p);
        setTimeout(()=>td.classList.add("dragging"),0);};
      td.ondragend=()=>{td.classList.remove("dragging");setTimeout(()=>{td._dragging=false;},50);
        document.querySelectorAll("#classOut td.slot").forEach(c=>c.classList.remove("drop-target","drop-invalid"));};
    }else{
      td.removeAttribute("draggable");td.classList.remove("draggable");
    }
    // ドロップ先（同じ学年グリッド内のみ移動可）
    td.ondragover=(e)=>{if(!dragSrc)return;if(dragSrc.grade!==g)return;e.preventDefault();e.dataTransfer.dropEffect="move";};
    td.ondragenter=(e)=>{if(!dragSrc||dragSrc.grade!==g)return;if(dragSrc.day===d&&dragSrc.period===p){return;}
      td.classList.add("drop-target");};
    td.ondragleave=()=>{td.classList.remove("drop-target");};
    td.ondrop=(e)=>{e.preventDefault();td.classList.remove("drop-target");
      if(!dragSrc||dragSrc.grade!==g)return;if(dragSrc.day===d&&dragSrc.period===p){dragSrc=null;return;}
      moveLateCell(dragSrc.day,dragSrc.period,d,p,g);dragSrc=null;};
  });
}
let dragSrc=null;
// 授業コマを移動（移動先に既存があれば入れ替え＝スワップ）。gradeはセルの学年（複数表示対応）
function moveLateCell(fromD,fromP,toD,toP,grade){
  const g=(grade!=null)?grade:cstate.grade;
  const src=findLate(g,cstate.world,fromD,fromP);
  if(!src)return;
  const dst=findLate(g,cstate.world,toD,toP);
  const wfull=fullWorldName(g,cstate.world);
  // 値のコピーを取っておく（合成データを直接書き換えても保存されないため）
  const srcData={grade:g,world:wfull,day:toD,period:toP,time:PTIME_FULL[toP],
    subject:src.subject,teacher:src.teacher,room:src.room,note:src.note||""};
  let dstData=null;
  if(dst){
    if(!confirm(`${toD}曜${toP}限には既に「${dst.subject}」があります。\n「${src.subject}」と入れ替えますか？`))return;
    dstData={grade:g,world:wfull,day:fromD,period:fromP,time:PTIME_FULL[fromP],
      subject:dst.subject,teacher:dst.teacher,room:dst.room,note:dst.note||""};
  }
  // 元の枠を消し、移動先へ。入れ替え時は相手を元の枠へ
  deleteCellRecord(g,cstate.world,fromD,fromP);
  saveCellRecord(srcData);
  if(dstData)saveCellRecord(dstData);
  renderClass();
}

/* 曜日コピー：ある曜日の全コマを別の曜日に複製 */
function openCopyDayModal(){
  if(!cstate.grade||!cstate.world){alert("学年とワールドを選んでください");return;}
  document.getElementById("cdSlot").textContent=`${cstate.grade}年 ${cstate.world}`;
  let cdFrom=null,cdTo=null;
  const fromSeg=document.getElementById("cdFromSeg"),toSeg=document.getElementById("cdToSeg");
  fromSeg.innerHTML=DAYS.map(d=>{
    const n=classData().filter(r=>r.grade===cstate.grade&&worldShortFull(r.world)===cstate.world&&r.day===d).length;
    return `<div class="opt" data-d="${d}">${d}（${n}）</div>`;}).join("");
  toSeg.innerHTML=DAYS.map(d=>`<div class="opt" data-d="${d}">${d}</div>`).join("");
  function upd(){
    document.getElementById("cdFromCur").textContent=cdFrom?`${cdFrom}曜`:"未選択";
    document.getElementById("cdFromCur").classList.toggle("empty",!cdFrom);
    document.getElementById("cdToCur").textContent=cdTo?`${cdTo}曜`:"未選択";
    document.getElementById("cdToCur").classList.toggle("empty",!cdTo);
    const note=document.getElementById("cdNote");
    if(cdFrom&&cdTo&&cdFrom!==cdTo){
      const srcN=classData().filter(r=>r.grade===cstate.grade&&worldShortFull(r.world)===cstate.world&&r.day===cdFrom).length;
      const dstN=classData().filter(r=>r.grade===cstate.grade&&worldShortFull(r.world)===cstate.world&&r.day===cdTo).length;
      note.style.display="";note.className="conflict-area "+(dstN?"warn":"okjoint");
      note.innerHTML=`<div class="cf-block"><div class="cf-title">${cdFrom}曜の ${srcN} コマを ${cdTo}曜にコピーします</div>`+
        (dstN?`<div class="cf-row" style="color:var(--warn)">${cdTo}曜には既に ${dstN} コマあります。上書きされます。</div>`:`<div class="cf-row" style="color:var(--ok)">${cdTo}曜は空きです。</div>`)+`</div>`;
    }else{note.style.display="none";}
  }
  fromSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{cdFrom=o.dataset.d;
    fromSeg.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===o));upd();});
  toSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{cdTo=o.dataset.d;
    toSeg.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===o));upd();});
  document.getElementById("cdFromCur").textContent="未選択";document.getElementById("cdFromCur").classList.add("empty");
  document.getElementById("cdToCur").textContent="未選択";document.getElementById("cdToCur").classList.add("empty");
  document.getElementById("cdNote").style.display="none";
  document.getElementById("cdSave").onclick=()=>{
    if(!cdFrom||!cdTo){alert("コピー元とコピー先の曜日を選んでください");return;}
    if(cdFrom===cdTo){alert("コピー元とコピー先が同じ曜日です");return;}
    const wfull=fullWorldName(cstate.grade,cstate.world);
    const srcRecs=classData().filter(r=>r.grade===cstate.grade&&worldShortFull(r.world)===cstate.world&&r.day===cdFrom);
    if(!srcRecs.length){alert(`${cdFrom}曜には授業がありません`);return;}
    // コピー元の値を控えてから処理（合成データ対策）
    const copies=srcRecs.map(r=>({grade:cstate.grade,world:wfull,day:cdTo,period:r.period,time:r.time||PTIME_FULL[r.period],
      subject:r.subject,teacher:r.teacher,room:r.room,note:r.note||""}));
    // コピー先の既存を削除
    PERIODS.forEach(p=>deleteCellRecord(cstate.grade,cstate.world,cdTo,p));
    // 複製を保存
    copies.forEach(c=>saveCellRecord(c));
    renderClass();closeCopyDayModal();
    alert(`${cdFrom}曜の ${srcRecs.length} コマを ${cdTo}曜にコピーしました。`);
  };
  document.getElementById("cdOverlay").classList.add("show");
}

document.getElementById("cdOverlay").onclick=e=>{if(e.target.id==="cdOverlay")closeCopyDayModal();};

/* ========== 編集モーダル ========== */
let editing=null;
// 枠内の全授業を取得（選択科目だと複数件）
function cellRecords(g,wShort,d,p){
  return classData().filter(r=>r.grade===g&&worldShortFull(r.world)===wShort&&r.day===d&&r.period===p);
}
function findLate(g,wShort,d,p){return cellRecords(g,wShort,d,p)[0];}
// 枠の授業リストをまるごと保存（前期＝差分、後期＝lateRecords）。recsは0件以上の配列
function saveCellRecords(grade,wShort,day,period,recs){
  const wfull=fullWorldName(grade,wShort);
  // 値を正規化
  const norm=recs.map(r=>({grade:grade,world:wfull,day:day,period:period,time:PTIME_FULL[period],
    subject:r.subject,teacher:r.teacher||"",room:r.room||"",note:r.note||""}));
  if(isLate()){
    // 該当枠の既存を全削除→入れ直し
    lateRecords=lateRecords.filter(r=>!(r.grade===grade&&worldShortFull(r.world)===wShort&&r.day===day&&r.period===period));
    norm.forEach(r=>lateRecords.push(r));
    saveLate();
  }else{
    const key=[grade,wfull,day,period].join("|");
    if(norm.length===0){
      // 空にする＝元データにあるなら削除差分、なければ差分削除
      const inGen=GEN.some(r=>r.grade===grade&&r.world===wfull&&r.day===day&&r.period===period);
      if(inGen)earlyEdits[key]={type:"delete"};else delete earlyEdits[key];
    }else{
      // 複数件は data に配列を持たせる（type:"editMulti"）。1件は従来通り type:"edit"
      if(norm.length===1)earlyEdits[key]={type:"edit",data:norm[0]};
      else earlyEdits[key]={type:"editMulti",list:norm};
    }
    saveEarlyEdits();
  }
}
// 後方互換：1コマ保存／削除（ドラッグや曜日コピーで使用）
function saveCellRecord(data){
  const wShort=worldShortFull(data.world);
  const existing=cellRecords(data.grade,wShort,data.day,data.period);
  // 同じ枠に既存があれば、それらは保持して追加ではなく「置き換え」るのが従来挙動 → 1件運用に合わせ全置換
  saveCellRecords(data.grade,wShort,data.day,data.period,[data]);
}
function deleteCellRecord(grade,wShort,day,period){
  saveCellRecords(grade,wShort,day,period,[]);
}
function editGrade(){return (editing&&editing.grade!=null)?editing.grade:cstate.grade;}
function openModal(d,p,grade){
  const g=(grade!=null)?grade:cstate.grade;
  // 枠内の全授業を読み込む（選択科目なら複数）
  const recs=cellRecords(g,cstate.world,d,p).map(r=>({subject:r.subject,teacher:r.teacher||"",room:r.room||"",note:r.note||""}));
  editing={day:d,period:p,grade:g,recs:recs,idx:recs.length?0:-1};
  document.getElementById("mSlot").textContent=`${g}年 ${cstate.world} ／ ${d}曜 ${p}限（${PTIME_FULL[p]}）`;
  // idx=-1なら新規入力、それ以外なら該当授業をフォームに読み込む
  loadFormFromEditing();
  renderCellList();
  ["sgSubject","sgTeacher","sgRoom"].forEach(id=>{const el=document.getElementById(id);el.classList.remove("show");el.innerHTML="";});
  updateCopyArea();updateConflict();updateFreeRooms();
  document.getElementById("overlay").classList.add("show");
  setTimeout(()=>document.getElementById("mSubject").focus(),50);}
function loadFormFromEditing(){
  const r=(editing.idx>=0)?editing.recs[editing.idx]:null;
  document.getElementById("mTitle").textContent=r?"授業を編集":(editing.recs.length?"選択科目を追加":"授業を登録");
  document.getElementById("mSubject").value=r?r.subject:"";
  document.getElementById("mTeacher").value=r?r.teacher:"";
  document.getElementById("mRoom").value=r?r.room:"";
  document.getElementById("mNote").value=r?(r.note||""):"";
  document.getElementById("mDelete").style.display=r?"":"none";
  document.getElementById("mSave").textContent=(editing.recs.length===0)?"保存":((editing.idx>=0)?"更新":"追加");
  const fl=document.getElementById("formLabel");
  if(editing.recs.length===0){fl.style.display="none";}
  else{fl.style.display="";fl.innerHTML=(editing.idx>=0)?`<span class="fl-edit">下の内容で「${esc(editing.recs[editing.idx].subject)}」を編集中</span>`:`<span class="fl-add">＋ 選択科目として新しい授業を追加</span>`;}
}
function renderCellList(){
  const el=document.getElementById("cellList");
  if(!editing.recs.length){el.style.display="none";el.innerHTML="";return;}
  el.style.display="";
  const multi=editing.recs.length>1;
  el.innerHTML=`<div class="cl-head">${multi?'<span class="cl-tag">選択科目</span>':''}この枠の授業（${editing.recs.length}件）</div>`+
    editing.recs.map((r,i)=>`<div class="cl-item${i===editing.idx?' active':''}" data-i="${i}">
      <div class="cl-main"><b>${esc(r.subject)}</b>${r.teacher?` ／ ${esc(r.teacher)}`:""}${r.room?` ／ ${esc(r.room)}`:""}</div>
      <button class="cl-edit" data-i="${i}">編集</button><button class="cl-del" data-i="${i}">削除</button></div>`).join("")+
    `<button class="cl-add" id="clAddBtn">＋ 選択科目を追加</button>`;
  el.querySelectorAll(".cl-edit").forEach(b=>b.onclick=(e)=>{e.stopPropagation();editing.idx=+b.dataset.i;loadFormFromEditing();renderCellList();updateConflict();updateCopyArea();});
  el.querySelectorAll(".cl-item").forEach(it=>it.onclick=()=>{editing.idx=+it.dataset.i;loadFormFromEditing();renderCellList();updateConflict();updateCopyArea();});
  el.querySelectorAll(".cl-del").forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const i=+b.dataset.i;editing.recs.splice(i,1);
    editing.idx=editing.recs.length?Math.min(i,editing.recs.length-1):-1;
    loadFormFromEditing();renderCellList();updateConflict();});
  const add=document.getElementById("clAddBtn");
  if(add)add.onclick=()=>{
    // 今フォームに入力中の内容があれば先に取り込んでから新規追加に切り替え
    commitFormToEditing(true);
    editing.idx=-1;loadFormFromEditing();renderCellList();
    document.getElementById("mSubject").focus();};
}
// フォームの入力を editing.recs に反映（silent=true なら未入力でも警告しない）
function commitFormToEditing(silent){
  const subj=document.getElementById("mSubject").value.trim();
  if(!subj){if(silent)return true;alert("科目名を入力してください");return false;}
  const data={subject:subj,teacher:document.getElementById("mTeacher").value.trim(),
    room:document.getElementById("mRoom").value.trim(),note:document.getElementById("mNote").value.trim()};
  if(editing.idx>=0)editing.recs[editing.idx]=data;
  else{editing.recs.push(data);editing.idx=editing.recs.length-1;}
  return true;
}
function closeModal(){document.getElementById("overlay").classList.remove("show");editing=null;
  document.getElementById("mSave").textContent="保存";
  document.getElementById("cellList").style.display="none";
  document.getElementById("formLabel").style.display="none";
  ["sgSubject","sgTeacher","sgRoom"].forEach(id=>document.getElementById(id).classList.remove("show"));
  const ca=document.getElementById("copyArea");ca.style.display="none";ca.innerHTML="";
  const cf=document.getElementById("conflictArea");cf.style.display="none";cf.innerHTML="";
  const fr=document.getElementById("freeRoomArea");fr.style.display="none";fr.innerHTML="";}
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal();};
document.getElementById("mSave").onclick=()=>{
  const subj=document.getElementById("mSubject").value.trim();if(!subj){alert("科目名を入力してください");return;}
  const {day,period}=editing;
  // 重複チェック：別科目との教室・教員の重複がある場合だけ確認（同名科目＝合同は通す）
  const rClash=roomConflicts().clash, tClash=teacherConflicts().clash;
  if(rClash.length||tClash.length){
    let msg=`${day}曜${period}限で重複があります。\n`;
    if(rClash.length)msg+=`\n【教室「${document.getElementById("mRoom").value.trim()}」】\n`+rClash.map(c=>`・${c.grade}年 ${c.world}：${c.subject}`).join("\n")+"\n";
    if(tClash.length)msg+=`\n【教員「${document.getElementById("mTeacher").value.trim()}」】\n`+tClash.map(c=>`・${c.grade}年 ${c.world}：${c.subject}`).join("\n")+"\n";
    msg+="\nこのまま登録しますか？";
    if(!confirm(msg))return;
  }
  // フォームの内容を取り込み、枠の授業リスト全体を保存
  if(!commitFormToEditing(false))return;
  saveCellRecords(editGrade(),cstate.world,day,period,editing.recs);
  renderClass();closeModal();};
document.getElementById("mDelete").onclick=()=>{
  // フォームに読み込み中の授業を削除
  if(editing.idx>=0){editing.recs.splice(editing.idx,1);editing.idx=editing.recs.length?0:-1;}
  if(editing.recs.length){loadFormFromEditing();renderCellList();updateConflict();}
  else{saveCellRecords(editGrade(),cstate.world,editing.day,editing.period,[]);renderClass();closeModal();}};

const pstate={q:"",person:null};
const STORE_PKEY="thl_kouki_persons_v1";
const STORE_PREC="thl_kouki_personrecs_v1";
let latePersons=[],lateP=[];
function loadLateP(){try{const a=localStorage.getItem(STORE_PKEY);if(a)latePersons=JSON.parse(a);
  const b=localStorage.getItem(STORE_PREC);if(b)lateP=JSON.parse(b);}catch(e){latePersons=[];lateP=[];}}
function saveLateP(){
  if(!VIEWER_MODE)ensureStudentKeys(); // 学生キーの自動発行（追加・読込のどの経路でも）
  try{localStorage.setItem(STORE_PKEY,JSON.stringify(latePersons));
  localStorage.setItem(STORE_PREC,JSON.stringify(lateP));}catch(e){}
  schedulePush();}
loadLateP();
function personRecords(){return isLate()?lateP:PER;}
function personList(){
  let list;
  if(isLate())list=latePersons.slice().sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,"ja"));
  else list=[...new Set(PER.map(r=>r.person))].map(name=>({name,grade:PER.find(r=>r.person===name).grade})).sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,"ja"));
  // 閲覧版の学生用URL：本人だけに制限（後期はサーバーが本人のみ返すが、前期の埋め込みデータも同名のみに絞る）

    const allowed=new Set((latePersons||[]).map(p=>p.name));
    list=list.filter(p=>allowed.has(p.name));

  return list;

let editingStudent=null;
function openStudentModal(name){
  editingStudent=name;
  const p=name?latePersons.find(x=>x.name===name):null;
  document.getElementById("spTitle").textContent=name?"学生情報を編集":"学生を追加";
  document.getElementById("spName").value=p?p.name:"";
  document.getElementById("spDelete").style.display=name?"":"none";
  const gseg=document.getElementById("spGradeSeg");
  gseg.innerHTML=[1,2,3,4].map(g=>`<div class="opt${p&&p.grade===g?' on':''}" data-g="${g}">${g}年</div>`).join("");
  let selGrade=p?p.grade:null,selWorld=p?p.world:null;
  function updateCur(){
    const gc=document.getElementById("spGradeCur");
    gc.textContent=selGrade?`${selGrade}年 を選択中`:"未選択";
    gc.classList.toggle("empty",!selGrade);
    const wc=document.getElementById("spWorldCur");
    if(!selGrade){wc.textContent="先に学年を選んでください";wc.classList.add("empty");}
    else if(selWorld){wc.textContent="選択中："+worldShortFull(selWorld)+"（クラス時間割を引き継ぎます）";wc.classList.remove("empty");}
    else{wc.textContent="所属なし（空の時間割から自由に入力します）";wc.classList.add("empty");}
  }
  function rebuildSpWorld(){
    const wseg=document.getElementById("spWorldSeg");
    if(!selGrade){wseg.innerHTML='<span style="color:var(--ink-soft);font-size:.82rem">先に学年を選択してください</span>';updateCur();return;}
    const ws=(OPT.world_by_grade[String(selGrade)]||[]).slice().sort((a,b)=>worldRank(a)-worldRank(b));
    wseg.innerHTML='<div class="opt'+(!selWorld?' on':'')+'" data-w="">所属なし</div>'+ws.map(w=>`<div class="opt${selWorld===w?' on':''}" data-w="${esc(w)}">${esc(worldShortFull(w))}</div>`).join("");
    wseg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{selWorld=o.dataset.w||null;rebuildSpWorld();});
    updateCur();
  }
  gseg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{selGrade=+o.dataset.g;selWorld=null;
    gseg.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===o));rebuildSpWorld();});
  rebuildSpWorld();updateCur();
  document.getElementById("spSave").onclick=()=>{
    const nm=document.getElementById("spName").value.trim();
    if(!nm){alert("氏名を入力してください");return;}
    if(!selGrade){alert("学年を選択してください");return;}
    if(!name&&latePersons.some(x=>x.name===nm)){alert("同じ氏名の学生が既にいます");return;}
    if(name){
      const old=latePersons.find(x=>x.name===name);
      if(nm!==name)lateP.forEach(r=>{if(r.person===name)r.person=nm;});
      old.name=nm;old.grade=selGrade;old.world=selWorld;pstate.person=nm;
    }else{
      latePersons.push({name:nm,grade:selGrade,world:selWorld});
      if(selWorld){
        lateRecords.filter(r=>r.grade===selGrade&&r.world===selWorld).forEach(r=>{
          lateP.push({person:nm,grade:selGrade,day:r.day,period:r.period,time:r.time,subject:r.subject,teacher:r.teacher,room:r.room,note:r.note||""});
        });
      }
      pstate.person=nm;
    }
    saveLateP();rebuildPersonPick();renderPerson();closeStudentModal();
  };
  document.getElementById("spDelete").onclick=()=>{
    if(!confirm(`${name} さんと、その時間割データを削除します。よろしいですか？`))return;
    latePersons=latePersons.filter(x=>x.name!==name);lateP=lateP.filter(r=>r.person!==name);
    if(pstate.person===name)pstate.person=null;
    saveLateP();rebuildPersonPick();renderPerson();closeStudentModal();
  };
  document.getElementById("spOverlay").classList.add("show");
  setTimeout(()=>document.getElementById("spName").focus(),50);
}

/* ========== 空き教室タブ ========== */
const fstate={day:null,period:null,grade:null};
function roomCat(rm){return SPECIAL_ROOMS.includes(rm)?"special":"normal";}
function normRooms(rm){const ALIAS={"エアラインルーム":"エアーラインルーム","403・404":"403・4","カフェ":"1Fカフェ"};
  const out=[];(rm||"").split(/[/／]/).forEach(part=>{part=part.trim().replace(/^[A-Za-z0-9]+[：:]/,"").replace(/\s*【.*?】/,"").trim();
    if(part&&ROOMS.includes(ALIAS[part]||part))out.push(ALIAS[part]||part);});return out;}
function roomUsage(grade){const use={};ROOMS.forEach(rm=>use[rm]={});
  classData().forEach(r=>{if(grade&&r.grade!==grade)return;normRooms(r.room).forEach(rm=>{
    (use[rm][r.day+"-"+r.period]=use[rm][r.day+"-"+r.period]||[]).push(r);});});return use;}
makeChips("freeDayChips",DAYS.map(d=>({label:d,val:d})),"day",null,fstate,()=>{renderFree();refreshChips("#freeView",fstate);});
makeChips("freePeriodChips",[1,2,3,4,5].map(p=>({label:p+"限",val:p})),"period",null,fstate,()=>{renderFree();refreshChips("#freeView",fstate);});
makeChips("freeGradeChips",[1,2,3,4].map(g=>({label:g+"年のみ",val:g})),"grade",it=>"g"+it.val,fstate,()=>{renderFree();refreshChips("#freeView",fstate);});
function roomCard(rm,extra,busy){return `<div class="room-card ${busy?'busy-card':roomCat(rm)}"><span class="room-name">${esc(rm)}</span>${extra||""}</div>`;}
function renderFree(){const note=document.getElementById("freeNote"),out=document.getElementById("freeOut");
  const use=roomUsage(fstate.grade);const gl=fstate.grade?`（${fstate.grade}年の授業のみで判定）`:"";
  const termL=term==="early"?"前期":"後期";
  const day=fstate.day,period=fstate.period;
  if(!day||!period){const hint=(NOW.day&&NOW.period)?`いまは ${NOW.day}曜${NOW.period}限 です。`:"";
    note.innerHTML=`<div class="mode-note f"><b>空き教室を探す（${termL}）</b>　曜日と時限を選ぶと、その時間に空いている教室が表示されます。${hint}${gl}</div>`;
    out.innerHTML='<div class="empty"><div class="big">曜日と時限を選んでください</div><div>例：「金」＋「3限」で、空いている教室が一覧表示されます。</div></div>';return;}
  const key=day+"-"+period;
  const freeNormal=ROOMS.filter(rm=>roomCat(rm)==="normal"&&!use[rm][key]);
  const freeSpecial=ROOMS.filter(rm=>roomCat(rm)==="special"&&!use[rm][key]);
  const busy=ROOMS.filter(rm=>use[rm][key]).map(rm=>({rm,subs:use[rm][key]}));
  note.innerHTML=`<div class="mode-note f"><b>${day}曜 ${period}限</b>（${PTIME_FULL[period]}）に空いている教室 ${gl}／ ${termL}</div>`;
  let html=`<div class="grid-head"><span class="gtitle">${day}曜 ${period}限</span><span class="gworld">空き ${freeNormal.length+freeSpecial.length} 室 / 全 ${ROOMS.length} 室</span></div>`;
  html+='<div class="free-section"><div class="fs-label">空いている教室（一般）</div>';
  html+= freeNormal.length?'<div class="room-list">'+freeNormal.map(rm=>roomCard(rm)).join("")+'</div>':'<div class="fs-none">空き教室はありません</div>';
  html+='</div>';
  if(freeSpecial.length)html+='<div class="free-section"><div class="fs-label">空いている特別教室</div><div class="room-list">'+freeSpecial.map(rm=>roomCard(rm)).join("")+'</div></div>';
  html+='<div class="free-section"><div class="fs-label busy-label">使用中の教室</div>';
  html+= busy.length?'<div class="room-list">'+busy.map(b=>roomCard(b.rm,`<span class="room-busy">${esc(b.subs[0].subject)}${b.subs.length>1?" 他":""}</span>`,true)).join("")+'</div>':'<div class="fs-none">使用中の教室はありません</div>';
  html+='</div>';out.innerHTML=html;}

/* ========== 時限別一覧ビュー（全ワールド横断） ========== */
const sstate={day:null,period:null};
makeChips("slotDayChips",DAYS.map(d=>({label:d,val:d})),"day",null,sstate,()=>{renderSlot();refreshChips("#slotView",sstate);});
makeChips("slotPeriodChips",[1,2,3,4,5].map(p=>({label:p+"限",val:p})),"period",null,sstate,()=>{renderSlot();refreshChips("#slotView",sstate);});
function renderSlot(){
  const note=document.getElementById("slotNote"),out=document.getElementById("slotOut");
  const termL=term==="early"?"前期":"後期";
  const {day,period}=sstate;
  if(!day||!period){
    const hint=(NOW.day&&NOW.period)?`いまは ${NOW.day}曜${NOW.period}限 です。`:"";
    note.innerHTML=`<div class="mode-note"><b>時限別一覧（${termL}）</b>　曜日と時限を選ぶと、その時間に開講される全学年・全ワールドの授業と使用教室を一覧できます。${hint}</div>`;
    out.innerHTML='<div class="empty"><div class="big">曜日と時限を選んでください</div><div>当て込み中の時間帯の埋まり具合を一望できます。</div></div>';return;}
  // その曜日時限の全授業
  const recs=classData().filter(r=>r.day===day&&r.period===period);
  // 教室の使用状況
  const usedRooms=new Set();recs.forEach(r=>normRooms(r.room).forEach(rm=>usedRooms.add(rm)));
  const freeRooms=ROOMS.filter(rm=>!usedRooms.has(rm));
  note.innerHTML=`<div class="mode-note"><b>${day}曜 ${period}限</b>（${PTIME_FULL[period]}）／ ${termL}　開講 ${recs.length} 件・使用教室 ${usedRooms.size}/${ROOMS.length}室</div>`;
  // 学年→ワールド順に並べる
  recs.sort((a,b)=>a.grade-b.grade||worldRank(a.world)-worldRank(b.world));
  let html='<div class="slot-table-wrap"><table class="slot-table"><thead><tr><th>学年</th><th>ワールド</th><th>科目</th><th>教員</th><th>教室</th></tr></thead><tbody>';
  if(recs.length){
    // 教室重複を検出（別科目で同教室）
    const roomToSubj={};recs.forEach(r=>normRooms(r.room).forEach(rm=>{(roomToSubj[rm]=roomToSubj[rm]||new Set()).add(r.subject+"|"+r.grade+"|"+r.world);}));
    html+=recs.map(r=>{
      const rrooms=normRooms(r.room);
      const dup=rrooms.some(rm=>{const set=roomToSubj[rm];if(!set||set.size<2)return false;
        // 別の枠（学年×ワールド）で同教室かつ別科目があるか
        return recs.some(o=>o!==r&&normRooms(o.room).includes(rm)&&o.subject!==r.subject&&!(o.grade===r.grade&&o.world===r.world));});
      const g="g"+r.grade;
      return `<tr class="${dup?'slot-dup':''}"><td><span class="tag grade ${g}">${r.grade}年</span></td><td>${esc(worldShortFull(r.world))}</td><td><b>${esc(r.subject)}</b></td><td>${esc(r.teacher||"-")}</td><td>${esc(r.room||"-")}${dup?' <span class="dup-mark">⚠重複</span>':''}</td></tr>`;
    }).join("");
  }else{
    html+='<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:18px">この時間に開講される授業はありません</td></tr>';
  }
  html+='</tbody></table></div>';
  // 空き教室
  html+=`<div class="slot-free"><div class="slot-free-label">この時間に空いている教室（${freeRooms.length}室）</div><div class="room-list">`;
  html+=freeRooms.length?freeRooms.map(rm=>`<span class="room-card ${roomCat(rm)==='special'?'special':''}" style="min-width:auto;padding:7px 12px"><span class="room-name" style="font-size:.88rem">${esc(rm)}</span></span>`).join(""):'<span class="fs-none">空き教室はありません</span>';
  html+='</div></div>';
  out.innerHTML=html;
}

/* ========== 教室別ビュー（特定教室の週間使用状況） ========== */
const rstate={room:null};
function rebuildRoomPick(){
  const el=document.getElementById("roomPick");
  el.innerHTML=ROOMS.map(rm=>`<div class="chip${rstate.room===rm?' on':''}" data-room="${esc(rm)}">${esc(rm)}</div>`).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{rstate.room=(rstate.room===c.dataset.room)?null:c.dataset.room;rebuildRoomPick();renderRoom();});
}
function renderRoom(){
  const note=document.getElementById("roomNote"),out=document.getElementById("roomOut");
  const termL=term==="early"?"前期":"後期";
  if(!rstate.room){
    note.innerHTML=`<div class="mode-note"><b>教室別の使用状況（${termL}）</b>　教室を選ぶと、その教室が週のどこで使われているかを週間表で確認できます。空いている枠を狙って当て込めます。</div>`;
    out.innerHTML='<div class="empty"><div class="big">教室を選んでください</div></div>';return;}
  const rm=rstate.room;
  // その教室を使う授業を曜日×時限で集計
  const map={};let used=0;
  classData().forEach(r=>{if(normRooms(r.room).includes(rm)){(map[r.day+"-"+r.period]=map[r.day+"-"+r.period]||[]).push(r);}});
  Object.values(map).forEach(a=>used+=a.length);
  note.innerHTML=`<div class="mode-note"><b>${esc(rm)}</b> の使用状況 ／ ${termL}　使用 ${Object.keys(map).length} コマ`+(Object.keys(map).length?'':'（未使用）')+`</div>`;
  let thead='<tr><th class="corner">時限</th>'+DAYS.map(d=>`<th class="${d===NOW.day?'todaycol':''}">${d}</th>`).join("")+'</tr>';
  let tbody=PERIODS.map(p=>{
    let tds=DAYS.map(d=>{const cell=map[d+"-"+p];const isNow=(d===NOW.day&&p===NOW.period);const nc=isNow?" nowcell":"";
      if(!cell)return `<td class="slot empty${nc}"><div class="room-free-mark">空き</div></td>`;
      const dup=cell.length>1&&[...new Set(cell.map(c=>c.subject))].length>1;
      return `<td class="slot${nc}${dup?' room-dup':''}">`+cell.map(r=>`<div class="slot-card"><div class="s-subj">${esc(r.subject)}</div><div class="s-line">${r.grade}年 ${esc(worldShortFull(r.world))}</div>${r.teacher?`<div class="s-line">${esc(r.teacher)}</div>`:""}</div>`).join("")+(dup?'<div class="dup-mark">⚠重複</div>':'')+'</td>';
    }).join("");
    return `<tr><td class="period-cell">${p}限<span class="ptime">${PTIME_FULL[p]}</span></td>${tds}</tr>`;
  }).join("");
  out.innerHTML=`<div class="grid-head"><span class="gtitle">${esc(rm)}</span><span class="gworld">${termL} / 週間使用状況</span></div><div class="table-scroll"><table class="week">${`<thead>${thead}</thead><tbody>${tbody}</tbody>`}</table></div>`;
}
// ツールの週間表と同じ「縦＝時限・横＝曜日」を学年×ワールドごとに縦に積む
async function exportExcel(){exportClassExcel("late");}
async function exportEarlyExcel(){exportClassExcel("early");}
async function exportClassExcel(which){
  const isEarly=(which==="early");
  const data=isEarly?earlyData():lateRecords;
  if(!data.length){alert(isEarly?"前期の授業データがありません":"後期の授業がまだ登録されていません");return;}
  if(typeof ExcelJS==="undefined"){alert("Excelライブラリの読み込みに失敗しました。ネット接続を確認して再読み込みしてください。");return;}
  const termLabel=isEarly?"前期":"後期";
  const C={header:"FF0B6E8F",headerDark:"FF0A5570",period:"FFEEF1F6",
    worldTitle:isEarly?"FF0B6E8F":"FF7A4EA8",  // 前期=青、後期=紫
    white:"FFFFFFFF",ink:"FF1A2332",line:"FFDDE3EC",fill:"FFF3FBF5",empty:"FFFBFCFD"};
  const bd=()=>({top:{style:'thin',color:{argb:C.line}},left:{style:'thin',color:{argb:C.line}},
    bottom:{style:'thin',color:{argb:C.line}},right:{style:'thin',color:{argb:C.line}}});
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(termLabel+"時間割",{views:[{showGridLines:false}]});
  ws.getColumn(1).width=12;[2,3,4,5,6].forEach(c=>ws.getColumn(c).width=22);
  let row=1;
  for(const grade of [1,2,3,4]){
    const wlist=(OPT.world_by_grade[String(grade)]||[]).slice().sort((a,b)=>worldRank(a)-worldRank(b));
    // そのワールドに授業があるものだけ出す（前期は実在ワールドのみ）
    const activeWorlds=wlist.filter(w=>data.some(r=>r.grade===grade&&r.world===w));
    if(!activeWorlds.length)continue;
    ws.mergeCells(row,1,row,6);const gh=ws.getCell(row,1);
    gh.value=`2026年度 ${termLabel} 時間割  【${grade}年生】`;
    gh.font={bold:true,size:13,color:{argb:C.ink}};gh.alignment={vertical:'middle'};
    ws.getRow(row).height=24;row++;
    for(const world of activeWorlds){
      ws.mergeCells(row,1,row,6);const wh=ws.getCell(row,1);wh.value=world;
      wh.font={bold:true,size:11,color:{argb:C.white}};
      wh.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.worldTitle}};
      wh.alignment={vertical:'middle',indent:1};ws.getRow(row).height=20;row++;
      const corner=ws.getCell(row,1);corner.value="時限";
      corner.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.headerDark}};
      corner.font={bold:true,color:{argb:C.white}};corner.alignment={horizontal:'center',vertical:'middle'};corner.border=bd();
      DAYS.forEach((d,i)=>{const c=ws.getCell(row,2+i);c.value=d;
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.header}};
        c.font={bold:true,color:{argb:C.white}};c.alignment={horizontal:'center',vertical:'middle'};c.border=bd();});
      ws.getRow(row).height=18;row++;
      for(const p of PERIODS){const r=ws.getRow(row);
        const pc=ws.getCell(row,1);pc.value=`${p}限\n${PTIME_FULL[p]}`;
        pc.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.period}};
        pc.font={bold:true,size:9,color:{argb:C.ink}};
        pc.alignment={horizontal:'center',vertical:'middle',wrapText:true};pc.border=bd();
        let maxLines=3;
        DAYS.forEach((d,i)=>{const c=ws.getCell(row,2+i);
          // 同じ枠の全授業（選択科目なら複数）
          const recs=data.filter(x=>x.grade===grade&&x.world===world&&x.day===d&&x.period===p);
          if(recs.length){
            const blocks=recs.map(rec=>{const lines=[rec.subject];
              if(rec.teacher)lines.push("講師: "+rec.teacher);
              if(rec.room)lines.push("教室: "+rec.room);
              if(rec.note)lines.push("※"+rec.note);return lines.join("\n");});
            const text=(recs.length>1?"【選択科目】\n":"")+blocks.join("\n─────\n");
            c.value=text;c.font={size:9,color:{argb:C.ink}};
            c.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.fill}};
            maxLines=Math.max(maxLines,text.split("\n").length);
          }else{c.value="";c.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.empty}};}
          c.alignment={horizontal:'left',vertical:'top',wrapText:true};c.border=bd();});
        r.height=Math.max(54,maxLines*13);
        row++;}
      row++;
    }
    row++;
  }
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`2026年度${termLabel}_THL時間割.xlsx`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJson(){if(!lateRecords.length){alert("後期の授業がまだ登録されていません");return;}
  const blob=new Blob([JSON.stringify(lateRecords,null,2)],{type:"application/json"});
